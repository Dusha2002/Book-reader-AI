name: bookai-source-vault-keygen

on:
  push:
    branches: [full-literary-reference-v9]
    paths:
      - '.github/workflows/bookai-source-vault-keygen.yml'

permissions:
  contents: read

jobs:
  keygen:
    runs-on: ubuntu-latest
    env:
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Derive source-vault public key from existing repository secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is missing' >&2; exit 1; }
          python -m pip install -q cryptography
          python - <<'PY'
          import base64, hashlib, os
          from cryptography.hazmat.primitives.asymmetric.x25519 import X25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat

          secret = os.environ['GIGACHAT_AUTH_KEY'].encode('utf-8')
          seed = hashlib.sha256(b'bookai-source-vault-x25519-v1\0' + secret).digest()
          private = X25519PrivateKey.from_private_bytes(seed)
          public = private.public_key().public_bytes(Encoding.Raw, PublicFormat.Raw)
          open('bookai-source-vault-public-key.txt', 'w', encoding='ascii').write(base64.b64encode(public).decode('ascii') + '\n')
          print('[bookai-source-vault] secret-derived X25519 public key ready; no private key persisted')
          PY
      - name: Upload public key
        uses: actions/upload-artifact@v4
        with:
          name: bookai-source-vault-public-key-x25519
          path: bookai-source-vault-public-key.txt
          retention-days: 1
