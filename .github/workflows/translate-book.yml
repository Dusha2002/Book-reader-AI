name: translate-book-quality

# Staged manually on purpose. After the blind benchmark is accepted, this
# workflow can be activated without changing translation code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore same-branch resumable cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-cache
          key: bookai-literary-full-v1-${{ github.run_id }}
          restore-keys: |
            bookai-literary-full-v1-

      - name: Install project
        run: pip install -e .

      - name: Translate full book with Flash-only literary harness
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a

          # Hard model ceiling and runtime values come AFTER .env.
          export BOOKAI_TRANSLATOR_BACKEND='api'
          export BOOKAI_MAX_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_TRANSLATOR_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_ANALYZER_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_GATE_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_EDITOR_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_HARD_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_MEMORY_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_LLM_GATE='true'
          export BOOKAI_REASONING='none'

          # Quality-first batch sizes. Speed tuning comes only after this run.
          export BOOKAI_BATCH_CHARS='12000'
          export BOOKAI_POLISH_BATCH_CHARS='8000'
          export BOOKAI_GATE_BATCH_CHARS='10000'
          export BOOKAI_EDIT_BATCH_CHARS='7000'
          export BOOKAI_ANALYSIS_CHARS='90000'
          export BOOKAI_QUALITY_REPAIR_ROUNDS='2'

          # Translation/polish can retry normally. Compact control roles are
          # bounded separately to prevent nested multi-minute stalls.
          export BOOKAI_RETRY_ATTEMPTS='3'
          export BOOKAI_REQUEST_TIMEOUT='180'
          export BOOKAI_ANALYZER_RETRY_ATTEMPTS='1'
          export BOOKAI_ANALYZER_REQUEST_TIMEOUT='75'
          export BOOKAI_GATE_RETRY_ATTEMPTS='2'
          export BOOKAI_GATE_REQUEST_TIMEOUT='90'
          export BOOKAI_MEMORY_RETRY_ATTEMPTS='2'
          export BOOKAI_MEMORY_REQUEST_TIMEOUT='75'

          test -f Devices_and_Desires.fb2
          test -n "${OPENROUTER_API_KEY:-${BOOKAI_API_KEY:-}}"
          echo 'Starting clean Flash-only literary full-book run'
          bookai Devices_and_Desires.fb2 \
            --output Devices_and_Desires_RU_LITERARY.fb2 \
            --mode optimal 2>&1 | tee translation.log

      - name: Independent structural and deterministic validation
        if: success()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from collections import defaultdict
          from lxml import etree
          from bookai.parsers.base import load_book
          from bookai.pipeline import _should_translate
          from bookai.quality import candidate_issues
          import re

          src_path = Path('Devices_and_Desires.fb2')
          out_path = Path('Devices_and_Desires_RU_LITERARY.fb2')
          assert out_path.exists() and out_path.stat().st_size > 100_000
          root = etree.parse(str(out_path))

          ns = {'f':'http://www.gribuser.ru/xml/fictionbook/2.0'}
          langs = [str(x).strip().lower() for x in root.xpath('//f:description//f:lang/text()', namespaces=ns)]
          src_langs = [str(x).strip().lower() for x in root.xpath('//f:description//f:src-lang/text()', namespaces=ns)]
          assert 'ru' in langs, f'FB2 target language is not ru: {langs}'
          assert not src_langs or 'en' in src_langs, f'Unexpected src-lang: {src_langs}'

          src = load_book(src_path)
          out = load_book(out_path)
          src_by_id = {s.id:s for s in src.segments}
          out_by_id = {s.id:s for s in out.segments}
          targets = [s for s in src.segments if _should_translate(s.text)]
          assert len(targets) == 3804, f'Expected 3804 targets, got {len(targets)}'

          missing = [s.id for s in targets if s.id not in out_by_id]
          assert not missing, f'Missing output segment ids: {missing[:20]}'

          hard = []
          medium = []
          translated = {}
          for source in targets:
              candidate = out_by_id[source.id].text
              translated[source.id] = candidate
              for issue in candidate_issues(source, candidate):
                  (hard if issue.severity == 'hard' else medium).append(issue)

          # Catch copy/paste collapse that ordinary per-segment QA can miss.
          reverse = defaultdict(list)
          for source in targets:
              candidate = re.sub(r'\s+', ' ', translated[source.id]).strip()
              if len(candidate) >= 120:
                  reverse[candidate].append(source.id)
          duplicate_groups = [ids for ids in reverse.values() if len(ids) >= 2]

          texts = [translated[s.id] for s in targets]
          cyr = sum(len(re.findall(r'[А-Яа-яЁё]', t)) for t in texts)
          lat = sum(len(re.findall(r'[A-Za-z]', t)) for t in texts)
          share = cyr / max(cyr + lat, 1)

          print(f'output_bytes={out_path.stat().st_size}')
          print(f'target_segments={len(targets)}')
          print(f'hard_deterministic_issues={len(hard)}')
          print(f'medium_deterministic_issues={len(medium)}')
          print(f'duplicate_long_translation_groups={len(duplicate_groups)}')
          print(f'text_cyrillic_share={share:.5f}')
          for issue in hard[:20]:
              print('HARD', issue)
          for ids in duplicate_groups[:10]:
              print('DUPLICATE', ids)

          assert not hard, f'Hard deterministic issues remain: {len(hard)}'
          assert not duplicate_groups, f'Suspicious repeated long translations: {len(duplicate_groups)}'
          assert share > 0.965, f'Unexpectedly low target Cyrillic share: {share:.4f}'
          PY

      - name: Upload translated book
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Devices_and_Desires_RU_LITERARY
          path: Devices_and_Desires_RU_LITERARY.fb2
          retention-days: 5

      - name: Save resumable cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-cache
          key: bookai-literary-full-v1-${{ github.run_id }}

      - name: Upload diagnostics and state
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: literary-full-diagnostics
          path: |
            translation.log
            .bookai-cache/**
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 2
