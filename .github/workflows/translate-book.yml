name: translate-book
on:
  push:
    branches: [translation-recovery-v4]

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore resumable translation cache
        id: restore-bookai-cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-cache
          key: bookai-devices-recovery-v4-${{ github.run_id }}
          restore-keys: |
            bookai-devices-recovery-v4-
            bookai-devices-recovery-v3-

      - name: Install project
        run: pip install -e .

      - name: Translate full book via OpenRouter
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source .env
          set +a

          # Runtime settings MUST override stale values tracked in .env.
          export BOOKAI_TRANSLATOR_BACKEND='api'
          export BOOKAI_TRANSLATOR_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_ANALYZER_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_GATE_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_EDITOR_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_MEMORY_MODEL='deepseek/deepseek-v4-flash-0731'
          export BOOKAI_LLM_GATE='true'
          export BOOKAI_REASONING='none'
          export BOOKAI_CONCURRENCY='3'
          export BOOKAI_BATCH_CHARS='40000'
          export BOOKAI_GATE_BATCH_CHARS='18000'
          export BOOKAI_EDIT_BATCH_CHARS='12000'
          export BOOKAI_ANALYSIS_CHARS='104000'
          export BOOKAI_RETRY_ATTEMPTS='3'
          export BOOKAI_REQUEST_TIMEOUT='300'

          test -f Devices_and_Desires.fb2
          test -n "${OPENROUTER_API_KEY:-${BOOKAI_API_KEY:-}}"
          echo "Starting v4 resumable Optimal translation"
          echo "Runtime: concurrency=$BOOKAI_CONCURRENCY translate_batch=$BOOKAI_BATCH_CHARS gate_batch=$BOOKAI_GATE_BATCH_CHARS edit_batch=$BOOKAI_EDIT_BATCH_CHARS analyzer=$BOOKAI_ANALYZER_MODEL editor=$BOOKAI_EDITOR_MODEL"
          bookai Devices_and_Desires.fb2 \
            --output Devices_and_Desires_RU.fb2 \
            --mode optimal 2>&1 | tee translation.log

      - name: Validate translated FB2
        if: success()
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          import re

          p = Path('Devices_and_Desires_RU.fb2')
          assert p.exists() and p.stat().st_size > 100000
          etree.parse(str(p))
          text = p.read_text('utf-8', errors='ignore')
          cyr = len(re.findall(r'[А-Яа-яЁё]', text))
          lat = len(re.findall(r'[A-Za-z]', text))
          share = cyr / max(cyr + lat, 1)
          long_english = re.findall(r'(?i)(?:\b[a-z]{3,}\b[\s,.;:!?—\-]*){18,}', text)
          print(f'output_bytes={p.stat().st_size}')
          print(f'cyrillic_letters={cyr}')
          print(f'latin_letters={lat}')
          print(f'cyrillic_share={share:.4f}')
          print(f'long_english_runs={len(long_english)}')
          assert share > 0.70, f'Unexpectedly low Cyrillic share: {share:.3f}'
          assert len(long_english) < 25, f'Too many long untranslated English runs: {len(long_english)}'
          PY

      - name: Upload translated book
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Devices_and_Desires_RU
          path: Devices_and_Desires_RU.fb2
          retention-days: 3

      - name: Save translation cache even after failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-cache
          key: bookai-devices-recovery-v4-${{ github.run_id }}

      - name: Upload diagnostics
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: translation-diagnostics
          path: |
            translation.log
            .bookai-cache/**
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 1
