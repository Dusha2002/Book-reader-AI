name: translate-book
on:
  push:
    branches: [translation-run-devices-desires]
jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe temporary input
        run: |
          set -euo pipefail
          python - <<'PY'
          import urllib.request
          url='https://drive.google.com/uc?export=download&id=1a6vXagKkgdU7arVLSHTxN6Fk-QqH6GtO'
          req=urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          try:
              with urllib.request.urlopen(req, timeout=30) as r:
                  data=r.read()
              print('download_bytes=', len(data))
              print('looks_fb2=', data.lstrip().startswith(b'<?xml'))
              open('/tmp/input.fb2','wb').write(data)
          except Exception as exc:
              print(type(exc).__name__, str(exc)[:300])
              raise
          PY
