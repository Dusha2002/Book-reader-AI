name: evil-for-evil-direct

on:
  push:
    branches: [full-literary-reference-v9]

concurrency:
  group: bookai-evil-for-evil-direct-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translate:
    if: ${{ contains(github.event.head_commit.message, '[book]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_BASE_URL: https://api.deepseek.com
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_ULTRA_MODEL: GigaChat-3-Ultra
      BOOKAI_GIGACHAT_ULTRA_TIMEOUT: '55'
      BOOKAI_GIGACHAT_ULTRA_MAX_TOKENS: '5000'
      BOOKAI_GIGACHAT_ULTRA_ATTEMPTS: '3'
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '12'
      BOOKAI_GIGACHAT_BATCH_CHARS: '10000'
      BOOKAI_GIGACHAT_SPLIT_DEPTH: '4'
      BOOKAI_GIGACHAT_MAX_TOKENS: '6000'
      BOOKAI_GIGACHAT_RECOVERY_ROUNDS: '1'
      BOOKAI_GIGACHAT_RATE_LIMIT_ATTEMPTS: '7'
      BOOKAI_GIGACHAT_RATE_LIMIT_BACKOFF: '2.0'
      BOOKAI_GIGACHAT_RATE_LIMIT_MAX_SLEEP: '12.0'
      BOOKAI_GIGACHAT_TOKEN_CACHE: /tmp/bookai-gigachat-token.json
      BOOKAI_GIGACHAT_TOKEN_CACHE_TTL: '1440'
      BOOKAI_GIGACHAT_OAUTH_ATTEMPTS: '2'
      BOOKAI_GIGACHAT_OAUTH_FAILURE_BACKOFF: '5'
      BOOKAI_ANALYZER_MODEL: deepseek-flash
      BOOKAI_TRANSLATOR_MODEL: deepseek-flash
      BOOKAI_GATE_MODEL: deepseek-flash
      BOOKAI_MEMORY_MODEL: deepseek-flash
      BOOKAI_EDITOR_MODEL: deepseek-flash
      BOOKAI_HARD_MODEL: deepseek-flash
      BOOKAI_MAX_MODEL: deepseek-flash
      BOOKAI_LLM_GATE: 'false'
      BOOKAI_REASONING: none
      BOOKAI_HYMT_HARD_THRESHOLD: '999'
      BOOKAI_DEEPSEEK_SEGMENT_CAP: '0'
      BOOKAI_DRAFT_RECOVERY_MAX: '0'
      BOOKAI_SECOND_REPAIR_MAX: '0'
      BOOKAI_FRESH_RETRANSLATE_MAX: '0'
      BOOKAI_BOOK_INTELLIGENCE_WAIT: '30'
      BOOKAI_TM_RETRIEVAL_K: '4'
      BOOKAI_HYBRID_BATCH_CHARS: '10000'
      BOOKAI_BULK_PROBE_SEGMENTS: '8'
      BOOKAI_RETRY_ATTEMPTS: '3'
      BOOKAI_REQUEST_TIMEOUT: '45'
      BOOKAI_ANALYZER_REQUEST_TIMEOUT: '60'
      BOOKAI_ANALYSIS_CHARS: '32000'
      BOOKAI_SOURCE_SAMPLE_WINDOWS: '8'
      BOOKAI_CONTEXT_WORKERS: '3'
      BOOKAI_RELIABILITY_WORKERS: '2'
      BOOKAI_V9F_CUE_WORDS: '5'
      BOOKAI_V9_REPAIR_MAX: '42'
      BOOKAI_V9_REPAIR_WORKERS: '3'
      BOOKAI_V9S_VERIFY_BATCH_CHARS: '11500'
      BOOKAI_V9S_TAIL_REPAIR_MAX: '20'
      BOOKAI_V9T_VERIFY_WORKERS: '2'
      BOOKAI_V9T_TAIL_WORKERS: '3'
      BOOKAI_V9X_RETRANSLATE_MAX: '15'
      BOOKAI_V9X_RETRANSLATE_WORKERS: '2'
      BOOKAI_V9Z_NAME_MAX: '36'
      BOOKAI_V9Z_VERIFY_MAX: '24'
      BOOKAI_V9Z_SECOND_REPAIR_MAX: '8'
      BOOKAI_V9AA_NAME_MAX: '64'
      BOOKAI_V9AA_VERIFY_EXTRA: '8'
      BOOKAI_V9AA_VERIFY_BATCH: '10'
      BOOKAI_V9AB_DEEP_REPAIR_MAX: '48'
      BOOKAI_V9AB_GIGA_EXTRA_MAX: '0'
      BOOKAI_V9AB_DEEP_BATCH: '8'
      BOOKAI_V9AB_FINAL_VERIFY_MAX: '48'
      BOOKAI_V9AB_VERIFY_BATCH: '12'
      BOOKAI_V9AD_NAME_MAX: '60'
      BOOKAI_V9AD_NAME_BATCH: '20'
      BOOKAI_V9AF_SANITIZER_MAX: '32'
      BOOKAI_V9AF_SANITIZER_BATCH: '18'
      BOOKAI_V9AG_RETRY_MAX: '16'
      BOOKAI_V8_SHARED_CACHE: '.bookai-cache-production-literary-v1'
      BOOKAI_FULL_CHAPTER_TIMEOUT_SECONDS: '1200'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and verify runtime
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q src scripts
          env -u BOOKAI_HYMT_HARD_THRESHOLD pytest -q

      - name: Fetch plain Evil for Evil source
        shell: bash
        run: |
          set -euo pipefail
          url="$(tr -d '\r\n' < .bookai-vault/evil-for-evil/source-url.txt)"
          test -n "$url"
          curl -L --fail --retry 3 --retry-all-errors "$url" -o production_source.fb2
          test -s production_source.fb2
          grep -q '<book-title>Evil for Evil</book-title>' production_source.fb2
          echo "[bookai] plain source ready bytes=$(wc -c < production_source.fb2) sha256=$(sha256sum production_source.fb2 | awk '{print $1}')"

      - name: Restore translation checkpoint
        id: checkpoint
        uses: actions/cache/restore@v4
        with:
          path: |
            .bookai-full-*
            .bookai-cache-production-literary-v1-*
            .bookai-cache-production-chapter-*
          key: bookai-evil-plain-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bookai-evil-plain-

      - name: Translate complete Evil for Evil
        id: full-book
        shell: bash
        run: |
          set -euo pipefail
          echo '[bookai] START full Evil for Evil translation'
          timeout --signal=TERM --kill-after=60s 300m \
            python scripts/production_book_full_translation.py 2>&1 | tee production-full-book.log

      - name: Validate complete reading build
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('production-full-book.json').read_text('utf-8'))
          if not report.get('reading_build_complete'):
              raise SystemExit('full reading build is incomplete')
          output = Path(report['output'])
          if not output.exists() or output.stat().st_size < 10000:
              raise SystemExit('full book artifact is missing or unexpectedly small')
          if report.get('segments_merged') != report.get('segments_total'):
              raise SystemExit('full book segment invariant failed')
          print('[bookai] complete chapters=', report['chapters_completed'],
                'segments=', report['segments_total'], 'review=', len(report.get('review_required_chapters') or []),
                'output=', output, 'bytes=', output.stat().st_size)
          PY

      - name: Save translation checkpoint
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            .bookai-full-*
            .bookai-cache-production-literary-v1-*
            .bookai-cache-production-chapter-*
          key: bookai-evil-plain-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload readable FB2 and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: evil-for-evil-russian-fb2
          path: |
            production_translation_ru.fb2
            production-full-book.json
            production-full-book.log
          if-no-files-found: warn
          retention-days: 14
