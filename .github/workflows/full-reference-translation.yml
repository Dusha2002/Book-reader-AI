name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  literary-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOOKAI_BASE_URL: https://openrouter.ai/api/v1
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '1'
      BOOKAI_GIGACHAT_BATCH_CHARS: '5000'
      BOOKAI_GIGACHAT_SPLIT_DEPTH: '3'
      BOOKAI_GIGACHAT_MAX_TOKENS: '3500'
      BOOKAI_ANALYZER_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_TRANSLATOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_GATE_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MEMORY_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_EDITOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_HARD_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MAX_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_REASONING: none
      BOOKAI_RETRY_ATTEMPTS: '2'
      BOOKAI_REQUEST_TIMEOUT: '120'
      BOOKAI_ANALYZER_REQUEST_TIMEOUT: '120'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project and GigaChat SDK
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q src scripts/literary_sample_eval.py
          pytest -q

      - name: Verify API secrets without exposing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is not configured' >&2; exit 1; }
          test -n "${OPENROUTER_API_KEY:-}" || { echo 'OPENROUTER_API_KEY is not configured' >&2; exit 1; }
          echo '[bookai] sample_only=1 cases=5 gigachat=GigaChat-3-Lightning deepseek=V4.1-Flash pro=disabled'

      - name: Translate and compare five literary fragments
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=20s 18m \
            python scripts/literary_sample_eval.py 2>&1 | tee literary-sample-eval.log

      - name: Upload literary comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: literary-sample-evaluation
          path: |
            literary-sample-eval.json
            literary-sample-eval.md
            literary-sample-eval.log
          if-no-files-found: ignore
          retention-days: 7
