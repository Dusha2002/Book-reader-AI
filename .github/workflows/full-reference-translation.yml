name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOOKAI_BASE_URL: https://openrouter.ai/api/v1
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore GigaChat-v11 resumable book cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-cache-reference-v11-gigachat
          key: bookai-reference-v11-gigachat-${{ github.run_id }}
          restore-keys: |
            bookai-reference-v11-gigachat-

      - name: Install project, GigaChat SDK and run tests
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q src scripts/hybrid_reference_translation.py scripts/rapid_reference_translation.py
          pytest -q

      - name: Verify GigaChat secret exists without exposing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is not configured' >&2; exit 1; }
          test -n "${OPENROUTER_API_KEY:-}" || { echo 'OPENROUTER_API_KEY is not configured' >&2; exit 1; }
          echo '[bookai] gigachat_secret_present=1 openrouter_secret_present=1'

      - name: GigaChat Lightning → DeepSeek V4.1 Flash literary translation
        shell: bash
        env:
          # DeepSeek is the reasoning/editorial layer, not the bulk translator.
          BOOKAI_TRANSLATOR_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_ANALYZER_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_GATE_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_MEMORY_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_EDITOR_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_HARD_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_LLM_GATE: 'false'
          BOOKAI_REASONING: none

          # Primary book translation: one PERS stream with multi-segment requests.
          BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
          BOOKAI_GIGACHAT_BATCH_SEGMENTS: '8'
          BOOKAI_GIGACHAT_BATCH_CHARS: '12000'
          BOOKAI_GIGACHAT_SPLIT_DEPTH: '5'
          BOOKAI_GIGACHAT_MAX_TOKENS: '7000'

          # Health/quality probe. Lightning is an intentional ~90 min PERS choice,
          # so the gate rejects only pathological slowness, auth failure or poor QA.
          BOOKAI_BULK_PROBE_SEGMENTS: '12'
          BOOKAI_BULK_MAX_ESTIMATE_SECONDS: '9000'
          BOOKAI_HYMT_HARD_THRESHOLD: '4.8'

          # DeepSeek remains bounded: hard prose, QA escalations and selected polish.
          BOOKAI_DEEPSEEK_SEGMENT_CAP: '300'
          BOOKAI_HYBRID_BATCH_CHARS: '16000'
          BOOKAI_RAPID_REFINE_MAX: '80'
          BOOKAI_RAPID_REFINE_WORKERS: '4'
          BOOKAI_RAPID_REFINE_BATCH_CHARS: '8000'
          BOOKAI_RETRY_ATTEMPTS: '2'
          BOOKAI_REQUEST_TIMEOUT: '180'
          BOOKAI_ANALYZER_REQUEST_TIMEOUT: '90'
          BOOKAI_ANALYSIS_CHARS: '70000'
          BOOKAI_STYLE_SAMPLE_CHARS: '12000'
          BOOKAI_CONTEXT_WORKERS: '6'
        run: |
          set -euo pipefail
          test -f Devices_and_Desires.fb2
          echo '[bookai] primary_translation=GigaChat-3-Lightning'
          echo '[bookai] reasoning_analysis=DeepSeek-V4.1-Flash'
          echo '[bookai] cost_policy=no-silent-whole-book-deepseek-fallback deepseek_segment_cap=300 refine_max=80'
          timeout --signal=TERM --kill-after=30s 165m \
            python scripts/hybrid_reference_translation.py 2>&1 | tee hybrid-translation.log

      - name: Set Russian FB2 metadata when full artifact exists
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          path = Path('Devices_and_Desires_RU_REFERENCE.fb2')
          if not path.exists():
              print('[metadata] no full FB2 produced in this run')
              raise SystemExit(0)
          tree = etree.parse(str(path))
          titles = tree.xpath("//*[local-name()='description']/*[local-name()='title-info']/*[local-name()='book-title']")
          if titles:
              titles[0].text = 'Замыслы и желания'
          langs = tree.xpath("//*[local-name()='description']/*[local-name()='title-info']/*[local-name()='lang']")
          if langs:
              langs[0].text = 'ru'
          tree.write(str(path), encoding='utf-8', xml_declaration=True, pretty_print=False)
          print('[metadata] updated')
          PY

      - name: Independent V4 Pro benchmark only for a complete book
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f reference-progress.json ]; then
            echo '[postflight] no complete-book progress report; benchmark deferred'
            exit 0
          fi
          if ! python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reference-progress.json')
          ok = p.exists() and json.loads(p.read_text('utf-8')).get('status') == 'complete'
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo '[postflight] partial/diagnostic run; benchmark deferred'
            exit 0
          fi
          test -n "${OPENROUTER_API_KEY:-}"
          export BOOKAI_REFERENCE_JUDGE_MODEL='deepseek/deepseek-v4-pro-0813'
          export BOOKAI_REASONING='none'
          python scripts/reference_quality_gate_v2.py \
            --candidate Devices_and_Desires_RU_REFERENCE.fb2 \
            --output reference-quality-postflight.json 2>&1 | tee reference-postflight.log

      - name: Upload GigaChat Lightning hybrid diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gigachat-lightning-deepseek-hybrid-diagnostics
          path: |
            hybrid-probe.json
            hybrid-routing.json
            hybrid-sample.json
            hybrid-translation.log
            reference-progress.json
            reference-quality-postflight.json
            Devices_and_Desires_RU_REFERENCE.fb2
          if-no-files-found: ignore
          retention-days: 7

      - name: Save GigaChat-v11 resumable book cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-cache-reference-v11-gigachat
          key: bookai-reference-v11-gigachat-${{ github.run_id }}
