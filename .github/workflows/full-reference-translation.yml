name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOOKAI_BASE_URL: https://openrouter.ai/api/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore resumable reference cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-cache-reference-v10
          key: bookai-reference-v10-${{ github.run_id }}
          restore-keys: |
            bookai-reference-v10-

      - name: Install project
        run: pip install -e .

      - name: Validate harness imports
        shell: bash
        run: |
          python -m compileall -q src scripts/reference_quality_gate.py scripts/reference_quality_gate_v2.py scripts/full_reference_translation.py
          python - <<'PY'
          from bookai.reference_harness import FLASH_MODEL, PRO_MODEL
          assert FLASH_MODEL == 'deepseek/deepseek-v4.1-flash'
          assert PRO_MODEL == 'deepseek/deepseek-v4-pro-0813'
          print('[bookai] import_sanity=ok model=' + FLASH_MODEL)
          PY
          mkdir -p .bookai-cache-reference-v10

      - name: OpenRouter V4.1 Flash smoke test
        shell: bash
        run: |
          test -n "${OPENROUTER_API_KEY:-}"
          export BOOKAI_REASONING='none'
          export BOOKAI_RETRY_ATTEMPTS='2'
          export BOOKAI_REQUEST_TIMEOUT='90'
          python - <<'PY'
          from bookai.llm import OpenAICompatibleProvider, extract_json
          provider = OpenAICompatibleProvider(model='deepseek/deepseek-v4.1-flash', role='smoke')
          obj = extract_json(provider.complete(
              'Return only valid JSON. No prose.',
              'Return exactly {"ok":true,"model":"v4.1-flash"}.',
              temperature=0.0,
          ))
          if not isinstance(obj, dict) or obj.get('ok') is not True:
              raise SystemExit(f'Unexpected smoke response: {obj!r}')
          print('[bookai] openrouter_smoke=ok model=deepseek/deepseek-v4.1-flash')
          PY

      - name: Translate complete book — balanced-fast V4.1 Flash
        continue-on-error: true
        shell: bash
        run: |
          export BOOKAI_TRANSLATOR_MODEL='deepseek/deepseek-v4.1-flash'
          export BOOKAI_ANALYZER_MODEL='deepseek/deepseek-v4.1-flash'
          export BOOKAI_GATE_MODEL='deepseek/deepseek-v4.1-flash'
          export BOOKAI_MEMORY_MODEL='deepseek/deepseek-v4.1-flash'
          export BOOKAI_EDITOR_MODEL='deepseek/deepseek-v4.1-flash'
          export BOOKAI_HARD_MODEL='deepseek/deepseek-v4.1-flash'

          # Keep generation moving. Semantic/literary critics remain advisory
          # outside generation; deterministic invariants still protect the cache.
          export BOOKAI_LLM_GATE='false'
          export BOOKAI_REASONING='none'

          # V4.1 Flash can safely handle larger context windows. Larger batches
          # sharply reduce request count while keeping the separate polish pass.
          export BOOKAI_BATCH_CHARS='16000'
          export BOOKAI_POLISH_BATCH_CHARS='10000'
          export BOOKAI_GATE_BATCH_CHARS='12000'
          export BOOKAI_EDIT_BATCH_CHARS='8000'
          export BOOKAI_ANALYSIS_CHARS='90000'
          export BOOKAI_CHAPTER_BRIEF_CHARS='26000'
          export BOOKAI_QUALITY_REPAIR_ROUNDS='1'

          # Decompose only genuinely difficult prose. Previously any 4-sentence
          # paragraph — even ~100 chars — became 4+ sequential model calls.
          # Batch up to four sentence obligations in each micro-call.
          export BOOKAI_V10_DECOMPOSE_CHARS='1600'
          export BOOKAI_V10_DECOMPOSE_SENTENCES='10'
          export BOOKAI_V10_ISOLATE_SENTENCE_CHARS='1000'
          export BOOKAI_V10_SENTENCE_BATCH='4'

          export BOOKAI_RETRY_ATTEMPTS='2'
          export BOOKAI_REQUEST_TIMEOUT='240'
          export BOOKAI_ANALYZER_RETRY_ATTEMPTS='2'
          export BOOKAI_ANALYZER_REQUEST_TIMEOUT='90'
          export BOOKAI_GATE_RETRY_ATTEMPTS='1'
          export BOOKAI_GATE_REQUEST_TIMEOUT='120'
          export BOOKAI_MEMORY_RETRY_ATTEMPTS='2'
          export BOOKAI_MEMORY_REQUEST_TIMEOUT='90'
          export BOOKAI_ANALYZER_MAX_TOKENS='4096'
          export BOOKAI_GATE_MAX_TOKENS='8192'
          export BOOKAI_MEMORY_MAX_TOKENS='4096'

          test -f Devices_and_Desires.fb2
          test -n "${OPENROUTER_API_KEY:-}"
          echo '[full-reference] mode=balanced-fast v4.1-flash; larger batches + selective decomposition + advisory LLM QA'
          python scripts/full_reference_translation.py 2>&1 | tee translation.log

      - name: Set Russian FB2 metadata when artifact exists
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          path = Path('Devices_and_Desires_RU_REFERENCE.fb2')
          if not path.exists():
              print('[metadata] no FB2 yet; skipping')
              raise SystemExit(0)
          tree = etree.parse(str(path))
          titles = tree.xpath("//*[local-name()='description']/*[local-name()='title-info']/*[local-name()='book-title']")
          if titles:
              titles[0].text = 'Замыслы и желания'
          langs = tree.xpath("//*[local-name()='description']/*[local-name()='title-info']/*[local-name()='lang']")
          if langs:
              langs[0].text = 'ru'
          tree.write(str(path), encoding='utf-8', xml_declaration=True, pretty_print=False)
          print('[metadata] updated')
          PY

      - name: Validate latest FB2 — advisory report
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path
          from bookai.parsers.base import load_book
          from bookai.pipeline import _should_translate

          src = Path('Devices_and_Desires.fb2')
          out = Path('Devices_and_Desires_RU_REFERENCE.fb2')
          report = {'output_exists': out.exists()}
          try:
              if not out.exists():
                  raise FileNotFoundError(out)
              source_doc = load_book(src)
              output_doc = load_book(out)
              targets = [s for s in source_doc.segments if _should_translate(s.text)]
              out_by_id = {s.id: s.text for s in output_doc.segments}
              suspicious, unchanged = [], []
              cyr = lat = 0
              for s in targets:
                  text = out_by_id.get(s.id, '')
                  l = len(re.findall(r'[A-Za-z]', text))
                  c = len(re.findall(r'[А-Яа-яЁё]', text))
                  lat += l; cyr += c
                  if l >= 20 and c < max(4, l // 4): suspicious.append(s.id)
                  if text.strip() == s.text.strip(): unchanged.append(s.id)
              report.update({
                  'output_bytes': out.stat().st_size,
                  'source_segments': len(source_doc.segments),
                  'output_segments': len(output_doc.segments),
                  'targets': len(targets),
                  'cyrillic_share': round(cyr / max(cyr + lat, 1), 5),
                  'suspicious_english': len(suspicious),
                  'unchanged_or_not_yet_translated': len(unchanged),
                  'sample_unfinished_ids': unchanged[:30],
              })
          except Exception as exc:
              report['validation_error'] = f'{type(exc).__name__}: {exc}'
          Path('reference-validation.json').write_text(json.dumps(report, ensure_ascii=False, indent=2), 'utf-8')
          print('[full-reference] validation=' + json.dumps(report, ensure_ascii=False, sort_keys=True))
          PY

      - name: Reference postflight — advisory when full translation exists
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if ! python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reference-progress.json')
          ok = p.exists() and json.loads(p.read_text('utf-8')).get('status') == 'complete'
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo '[reference-postflight] partial translation: benchmark deferred'
            exit 0
          fi
          export BOOKAI_REFERENCE_JUDGE_MODEL='deepseek/deepseek-v4-pro-0813'
          export BOOKAI_REASONING='none'
          export BOOKAI_RETRY_ATTEMPTS='2'
          export BOOKAI_REQUEST_TIMEOUT='240'
          python scripts/reference_quality_gate_v2.py \
            --candidate Devices_and_Desires_RU_REFERENCE.fb2 \
            --output reference-quality-postflight.json 2>&1 | tee reference-postflight.log

      - name: Upload latest usable translated book
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Devices_and_Desires_RU_REFERENCE_LATEST
          path: |
            Devices_and_Desires_RU_REFERENCE.fb2
            reference-progress.json
            reference-validation.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload reference reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-quality-reports
          path: |
            reference-quality-preflight.json
            reference-quality-postflight.json
            reference-preflight.log
            reference-postflight.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save resumable translation cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-cache-reference-v10
          key: bookai-reference-v10-${{ github.run_id }}

      - name: Upload resumable state and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-reference-diagnostics
          path: |
            translation.log
            reference-progress.json
            reference-validation.json
            .bookai-cache-reference-v10/**
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 5