name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chapter-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_BASE_URL: https://api.deepseek.com
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '12'
      BOOKAI_GIGACHAT_BATCH_CHARS: '10000'
      BOOKAI_GIGACHAT_SPLIT_DEPTH: '4'
      BOOKAI_GIGACHAT_MAX_TOKENS: '6000'
      BOOKAI_GIGACHAT_RECOVERY_ROUNDS: '1'
      BOOKAI_GIGACHAT_TOKEN_CACHE: /tmp/bookai-gigachat-token.json
      BOOKAI_GIGACHAT_TOKEN_CACHE_TTL: '1440'
      BOOKAI_GIGACHAT_OAUTH_ATTEMPTS: '2'
      BOOKAI_GIGACHAT_OAUTH_FAILURE_BACKOFF: '5'
      BOOKAI_ANALYZER_MODEL: deepseek-flash
      BOOKAI_TRANSLATOR_MODEL: deepseek-flash
      BOOKAI_GATE_MODEL: deepseek-flash
      BOOKAI_MEMORY_MODEL: deepseek-flash
      BOOKAI_EDITOR_MODEL: deepseek-flash
      BOOKAI_HARD_MODEL: deepseek-flash
      BOOKAI_MAX_MODEL: deepseek-flash
      BOOKAI_LLM_GATE: 'false'
      BOOKAI_REASONING: none
      BOOKAI_HYMT_HARD_THRESHOLD: '999'
      BOOKAI_DEEPSEEK_SEGMENT_CAP: '0'
      BOOKAI_DRAFT_RECOVERY_MAX: '0'
      BOOKAI_SECOND_REPAIR_MAX: '0'
      BOOKAI_FRESH_RETRANSLATE_MAX: '0'
      BOOKAI_BOOK_INTELLIGENCE_WAIT: '30'
      BOOKAI_TM_RETRIEVAL_K: '4'
      BOOKAI_HYBRID_BATCH_CHARS: '10000'
      BOOKAI_BULK_PROBE_SEGMENTS: '8'
      BOOKAI_RETRY_ATTEMPTS: '3'
      BOOKAI_REQUEST_TIMEOUT: '45'
      BOOKAI_ANALYZER_REQUEST_TIMEOUT: '60'
      BOOKAI_ANALYSIS_CHARS: '32000'
      BOOKAI_CONTEXT_WORKERS: '3'
      BOOKAI_RELIABILITY_WORKERS: '2'
      BOOKAI_V9F_CUE_WORDS: '5'
      BOOKAI_V9_REPAIR_MAX: '42'
      BOOKAI_V9_REPAIR_WORKERS: '3'
      BOOKAI_V9S_VERIFY_BATCH_CHARS: '11500'
      BOOKAI_V9S_TAIL_REPAIR_MAX: '20'
      BOOKAI_V9T_VERIFY_WORKERS: '2'
      BOOKAI_V9T_TAIL_WORKERS: '3'
      BOOKAI_V9X_RETRANSLATE_MAX: '15'
      BOOKAI_V9X_RETRANSLATE_WORKERS: '2'
      BOOKAI_V9Z_NAME_MAX: '36'
      BOOKAI_V9Z_VERIFY_MAX: '24'
      BOOKAI_V9Z_SECOND_REPAIR_MAX: '8'
      BOOKAI_V9AA_NAME_MAX: '64'
      BOOKAI_V9AA_VERIFY_EXTRA: '8'
      BOOKAI_V9AA_VERIFY_BATCH: '10'
      BOOKAI_V9AB_DEEP_REPAIR_MAX: '48'
      BOOKAI_V9AB_GIGA_EXTRA_MAX: '0'
      BOOKAI_V9AB_DEEP_BATCH: '8'
      BOOKAI_V9AB_FINAL_VERIFY_MAX: '48'
      BOOKAI_V9AB_VERIFY_BATCH: '12'
      BOOKAI_V9AD_NAME_MAX: '60'
      BOOKAI_V9AD_NAME_BATCH: '20'
      BOOKAI_V9AF_SANITIZER_MAX: '32'
      BOOKAI_V9AF_SANITIZER_BATCH: '18'
      BOOKAI_V9AG_RETRY_MAX: '16'
      BOOKAI_V8_SHARED_CACHE: '.bookai-cache-first-three-v9ah-source-only'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and run tests
        env:
          BOOKAI_HYMT_HARD_THRESHOLD: '4.8'
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q src scripts/chapter_reference_translation_v3.py scripts/chapter_reference_translation_v4.py scripts/chapter_reference_translation_v4b.py scripts/chapter_reference_translation_v5.py scripts/chapter_reference_translation_v6.py scripts/chapter_reference_translation_v7.py scripts/chapter_reference_translation_v8.py scripts/chapter_reference_translation_v8b.py scripts/chapter_reference_translation_v8c.py scripts/chapter_reference_translation_v9.py scripts/chapter_reference_translation_v9b.py scripts/chapter_reference_translation_v9c.py scripts/chapter_reference_translation_v9d.py scripts/chapter_reference_translation_v9e.py scripts/chapter_reference_translation_v9f.py scripts/chapter_reference_translation_v9g.py scripts/chapter_reference_translation_v9h.py scripts/chapter_reference_translation_v9i.py scripts/chapter_reference_translation_v9j.py scripts/chapter_reference_translation_v9k.py scripts/chapter_reference_translation_v9l.py scripts/chapter_reference_translation_v9m.py scripts/chapter_reference_translation_v9n.py scripts/chapter_reference_translation_v9o.py scripts/chapter_reference_translation_v9p.py scripts/chapter_reference_translation_v9q.py scripts/chapter_reference_translation_v9r.py scripts/chapter_reference_translation_v9s.py scripts/chapter_reference_translation_v9t.py scripts/chapter_reference_translation_v9u.py scripts/chapter_reference_translation_v9v.py scripts/chapter_reference_translation_v9w.py scripts/chapter_reference_translation_v9x.py scripts/chapter_reference_translation_v9y.py scripts/chapter_reference_translation_v9z.py scripts/chapter_reference_translation_v9aa.py scripts/chapter_reference_translation_v9ab.py scripts/chapter_reference_translation_v9ac.py scripts/chapter_reference_translation_v9ad.py scripts/chapter_reference_translation_v9ae.py scripts/chapter_reference_translation_v9af.py scripts/chapter_reference_translation_v9ag.py scripts/chapter_reference_translation_v9ah.py scripts/chapter_reference_translation_v9ai.py scripts/setup_bergamot_enru.py scripts/bergamot_worker.py scripts/hybrid_reference_translation.py
          pytest -q
      - name: Verify API secrets without exposing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is not configured' >&2; exit 1; }
          test -n "${DEEPSEEK_API_KEY:-}" || { echo 'DEEPSEEK_API_KEY is not configured' >&2; exit 1; }
          echo '[bookai] architecture=v9ah primary=gigachat-lightning downstream=adaptive-sparse-deepseek+validated-sanitizer source-only=yes gold-reference=no'
      - name: Translate Chapters One through Three with v9ah
        shell: bash
        run: |
          set -euo pipefail
          test -f Devices_and_Desires.fb2
          for word in One Two Three; do
            slug=$(printf '%s' "$word" | tr '[:upper:]' '[:lower:]')
            echo "[bookai] ===== START Chapter ${word} ====="
            BOOKAI_CHAPTER_NAME="Chapter ${word}" timeout --signal=TERM --kill-after=30s 15m \
              python scripts/chapter_reference_translation_v9ah.py 2>&1 | tee "chapter-v9-full-${slug}.log"
            echo "[bookai] ===== DONE Chapter ${word} ====="
          done
      - name: Upload first three chapters v9ah evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-three-chapters-v9ah-source-only-evaluation
          path: |
            Devices_and_Desires_RU_*_EVAL_V9.fb2
            chapter-v9-*.txt
            chapter-v9-*.json
            chapter-v9-*.log
          if-no-files-found: ignore
          retention-days: 7
