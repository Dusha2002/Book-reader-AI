name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chapter-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOOKAI_BASE_URL: https://openrouter.ai/api/v1
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1

      BOOKAI_CHAPTER_NAME: Chapter Eleven
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '8'
      BOOKAI_GIGACHAT_BATCH_CHARS: '12000'
      BOOKAI_GIGACHAT_SPLIT_DEPTH: '6'
      BOOKAI_GIGACHAT_MAX_TOKENS: '7000'
      BOOKAI_GIGACHAT_RECOVERY_ROUNDS: '3'

      BOOKAI_ANALYZER_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_TRANSLATOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_GATE_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MEMORY_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_EDITOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_HARD_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MAX_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_LLM_GATE: 'false'
      BOOKAI_REASONING: none

      # First pass stays entirely on Lightning; DeepSeek is analysis/recovery/refinement.
      BOOKAI_HYMT_HARD_THRESHOLD: '999'
      BOOKAI_DEEPSEEK_SEGMENT_CAP: '90'
      BOOKAI_RAPID_REFINE_MAX: '45'
      BOOKAI_RAPID_REFINE_WORKERS: '4'
      BOOKAI_RAPID_REFINE_BATCH_CHARS: '8000'
      BOOKAI_HYBRID_BATCH_CHARS: '9000'
      BOOKAI_BULK_PROBE_SEGMENTS: '8'
      BOOKAI_BULK_MAX_ESTIMATE_SECONDS: '3600'
      BOOKAI_RETRY_ATTEMPTS: '2'
      BOOKAI_REQUEST_TIMEOUT: '180'
      BOOKAI_ANALYZER_REQUEST_TIMEOUT: '120'
      BOOKAI_ANALYSIS_CHARS: '50000'
      BOOKAI_STYLE_SAMPLE_CHARS: '12000'
      BOOKAI_CONTEXT_WORKERS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Chapter Eleven resumable cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-cache-ch11-eval-v1
          key: bookai-ch11-eval-v1-${{ github.run_id }}
          restore-keys: |
            bookai-ch11-eval-v1-

      - name: Install project and run tests
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q src scripts/chapter_reference_translation.py scripts/hybrid_reference_translation.py
          pytest -q

      - name: Verify API secrets without exposing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is not configured' >&2; exit 1; }
          test -n "${OPENROUTER_API_KEY:-}" || { echo 'OPENROUTER_API_KEY is not configured' >&2; exit 1; }
          echo '[bookai] chapter=Chapter Eleven primary=GigaChat-3-Lightning reasoning=DeepSeek-V4.1-Flash pro=disabled'

      - name: Translate Chapter Eleven end-to-end
        shell: bash
        run: |
          set -euo pipefail
          test -f Devices_and_Desires.fb2
          timeout --signal=TERM --kill-after=30s 50m \
            python scripts/chapter_reference_translation.py 2>&1 | tee chapter11-eval.log

      - name: Upload Chapter Eleven evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-eleven-literary-evaluation
          path: |
            Devices_and_Desires_RU_CH11_EVAL.fb2
            chapter11-source.txt
            chapter11-translated.txt
            chapter11-translation-map.json
            chapter11-eval.json
            chapter11-progress.json
            chapter11-probe.json
            chapter11-routing.json
            chapter11-eval.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Chapter Eleven resumable cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-cache-ch11-eval-v1
          key: bookai-ch11-eval-v1-${{ github.run_id }}
