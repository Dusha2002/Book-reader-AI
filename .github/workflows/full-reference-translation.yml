name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chapter-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOOKAI_BASE_URL: https://openrouter.ai/api/v1
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '12'
      BOOKAI_GIGACHAT_BATCH_CHARS: '10000'
      BOOKAI_GIGACHAT_SPLIT_DEPTH: '4'
      BOOKAI_GIGACHAT_MAX_TOKENS: '6000'
      BOOKAI_GIGACHAT_RECOVERY_ROUNDS: '1'
      BOOKAI_ANALYZER_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_TRANSLATOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_GATE_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MEMORY_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_EDITOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_HARD_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MAX_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_LLM_GATE: 'false'
      BOOKAI_REASONING: none
      BOOKAI_HYMT_HARD_THRESHOLD: '999'
      BOOKAI_DEEPSEEK_SEGMENT_CAP: '0'
      BOOKAI_DRAFT_RECOVERY_MAX: '0'
      BOOKAI_SECOND_REPAIR_MAX: '0'
      BOOKAI_FRESH_RETRANSLATE_MAX: '0'
      BOOKAI_BOOK_INTELLIGENCE_WAIT: '30'
      BOOKAI_TM_RETRIEVAL_K: '4'
      BOOKAI_HYBRID_BATCH_CHARS: '10000'
      BOOKAI_BULK_PROBE_SEGMENTS: '8'
      BOOKAI_RETRY_ATTEMPTS: '1'
      BOOKAI_REQUEST_TIMEOUT: '45'
      BOOKAI_ANALYZER_REQUEST_TIMEOUT: '60'
      BOOKAI_ANALYSIS_CHARS: '28500'
      BOOKAI_CONTEXT_WORKERS: '4'
      BOOKAI_RELIABILITY_WORKERS: '4'
      BOOKAI_V9F_CUE_WORDS: '5'
      BOOKAI_V9_REPAIR_MAX: '42'
      BOOKAI_V9_REPAIR_WORKERS: '5'
      BOOKAI_V8_SHARED_CACHE: '.bookai-cache-first-three-v9q'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and run tests
        env:
          BOOKAI_HYMT_HARD_THRESHOLD: '4.8'
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q src scripts/chapter_reference_translation_v3.py scripts/chapter_reference_translation_v4.py scripts/chapter_reference_translation_v4b.py scripts/chapter_reference_translation_v5.py scripts/chapter_reference_translation_v6.py scripts/chapter_reference_translation_v7.py scripts/chapter_reference_translation_v8.py scripts/chapter_reference_translation_v8b.py scripts/chapter_reference_translation_v8c.py scripts/chapter_reference_translation_v9.py scripts/chapter_reference_translation_v9b.py scripts/chapter_reference_translation_v9c.py scripts/chapter_reference_translation_v9d.py scripts/chapter_reference_translation_v9e.py scripts/chapter_reference_translation_v9f.py scripts/chapter_reference_translation_v9g.py scripts/chapter_reference_translation_v9h.py scripts/chapter_reference_translation_v9i.py scripts/chapter_reference_translation_v9j.py scripts/chapter_reference_translation_v9k.py scripts/chapter_reference_translation_v9l.py scripts/chapter_reference_translation_v9m.py scripts/chapter_reference_translation_v9n.py scripts/chapter_reference_translation_v9o.py scripts/chapter_reference_translation_v9p.py scripts/chapter_reference_translation_v9q.py scripts/hybrid_reference_translation.py
          pytest -q
      - name: Verify API secrets without exposing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is not configured' >&2; exit 1; }
          test -n "${OPENROUTER_API_KEY:-}" || { echo 'OPENROUTER_API_KEY is not configured' >&2; exit 1; }
          echo '[bookai] architecture=v9q chapters=one,two,three shared-self-tm=yes full-qe=yes gold-reference=no'
      - name: Translate Chapters One through Three with v9q
        shell: bash
        run: |
          set -euo pipefail
          test -f Devices_and_Desires.fb2
          for word in One Two Three; do
            slug=$(printf '%s' "$word" | tr '[:upper:]' '[:lower:]')
            echo "[bookai] ===== START Chapter ${word} ====="
            BOOKAI_CHAPTER_NAME="Chapter ${word}" timeout --signal=TERM --kill-after=30s 15m \
              python scripts/chapter_reference_translation_v9q.py 2>&1 | tee "chapter-v9-full-${slug}.log"
            echo "[bookai] ===== DONE Chapter ${word} ====="
          done
      - name: Upload first three chapters v9q evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-three-chapters-quality-v9q-source-only-evaluation
          path: |
            Devices_and_Desires_RU_*_EVAL_V9.fb2
            chapter-v9-*.txt
            chapter-v9-*.json
            chapter-v9-*.log
          if-no-files-found: ignore
          retention-days: 7
