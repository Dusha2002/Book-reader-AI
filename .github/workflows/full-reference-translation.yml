name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOOKAI_BASE_URL: https://openrouter.ai/api/v1
      AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
      AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
      AZURE_TRANSLATOR_ENDPOINT: https://api.cognitive.microsofttranslator.com
      BOOKAI_OPUS_MODEL_DIR: .bookai-opus/opus-mt-en-ru-ctranslate2-int8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore resumable book cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-cache-reference-v10
          key: bookai-reference-v10-${{ github.run_id }}
          restore-keys: |
            bookai-reference-v10-

      - name: Restore tiny OPUS-MT cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-opus
          key: opus-mt-en-ru-ct2-int8-v1

      - name: Install project and run tests
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev,mt]'
          python -m compileall -q src scripts/hybrid_reference_translation.py scripts/rapid_reference_translation.py
          pytest -q

      - name: Prepare tiny OPUS-MT INT8 fallback
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "$BOOKAI_OPUS_MODEL_DIR/model.bin" ]; then
            rm -rf .bookai-opus/download .bookai-opus/model.zip
            mkdir -p .bookai-opus/download "$BOOKAI_OPUS_MODEL_DIR"
            curl -L --fail --retry 3 \
              'https://huggingface.co/ordois/opus-mt-en-ru-ctranslate2-int8/resolve/main/opus-mt-en-ru-ctranslate2-int8.zip?download=true' \
              -o .bookai-opus/model.zip
            unzip -q .bookai-opus/model.zip -d .bookai-opus/download
            MODEL_BIN="$(find .bookai-opus/download -type f -name model.bin -print -quit)"
            if [ -z "$MODEL_BIN" ]; then
              echo 'OPUS-MT archive does not contain model.bin' >&2
              exit 1
            fi
            MODEL_SRC="$(dirname "$MODEL_BIN")"
            cp -a "$MODEL_SRC"/. "$BOOKAI_OPUS_MODEL_DIR"/
            rm -rf .bookai-opus/download .bookai-opus/model.zip
          fi
          test -f "$BOOKAI_OPUS_MODEL_DIR/model.bin"
          test -f "$BOOKAI_OPUS_MODEL_DIR/source.spm"
          test -f "$BOOKAI_OPUS_MODEL_DIR/target.spm"
          python - <<'PY'
          from bookai.bulk_mt import OPUSMTBackend
          backend = OPUSMTBackend()
          assert backend.available(), backend.model_dir
          print('[bulk-mt] opus_ready=' + str(backend.model_dir))
          PY

      - name: Azure / OPUS → DeepSeek literary translation
        shell: bash
        env:
          BOOKAI_TRANSLATOR_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_ANALYZER_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_GATE_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_MEMORY_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_EDITOR_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_HARD_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_LLM_GATE: 'false'
          BOOKAI_REASONING: none

          # Free/cheap bulk path. Azure is preferred when its optional secret is configured;
          # otherwise the ~80 MB OPUS-MT INT8 model runs locally on CPU.
          BOOKAI_BULK_PROBE_SEGMENTS: '12'
          BOOKAI_BULK_MAX_ESTIMATE_SECONDS: '1500'
          BOOKAI_BULK_HARD_THRESHOLD: '4.8'
          BOOKAI_HYMT_HARD_THRESHOLD: '4.8'
          BOOKAI_AZURE_WORKERS: '2'
          BOOKAI_AZURE_REQUEST_CHARS: '45000'
          BOOKAI_AZURE_REQUEST_ITEMS: '500'
          BOOKAI_OPUS_BEAM_SIZE: '1'
          BOOKAI_OPUS_MAX_BATCH: '256'

          # Paid path is bounded and cannot become a silent whole-book fallback.
          BOOKAI_DEEPSEEK_SEGMENT_CAP: '300'
          BOOKAI_HYBRID_BATCH_CHARS: '16000'
          BOOKAI_RAPID_REFINE_MAX: '80'
          BOOKAI_RAPID_REFINE_WORKERS: '4'
          BOOKAI_RAPID_REFINE_BATCH_CHARS: '8000'
          BOOKAI_RETRY_ATTEMPTS: '2'
          BOOKAI_REQUEST_TIMEOUT: '180'
          BOOKAI_ANALYZER_REQUEST_TIMEOUT: '90'
        run: |
          set -euo pipefail
          test -f Devices_and_Desires.fb2
          if [ -n "${AZURE_TRANSLATOR_KEY:-}" ]; then
            echo '[bulk-mt] primary=azure-translator-v3 fallback=opus-int8'
          else
            echo '[bulk-mt] primary=opus-int8 azure=not-configured'
          fi
          echo '[bookai] cost_policy=fail-closed deepseek_segment_cap=300 refine_max=80'
          timeout --signal=TERM --kill-after=30s 32m \
            python scripts/hybrid_reference_translation.py 2>&1 | tee hybrid-translation.log

      - name: Set Russian FB2 metadata when full artifact exists
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          path = Path('Devices_and_Desires_RU_REFERENCE.fb2')
          if not path.exists():
              print('[metadata] no full FB2 produced in this run')
              raise SystemExit(0)
          tree = etree.parse(str(path))
          titles = tree.xpath("//*[local-name()='description']/*[local-name()='title-info']/*[local-name()='book-title']")
          if titles:
              titles[0].text = 'Замыслы и желания'
          langs = tree.xpath("//*[local-name()='description']/*[local-name()='title-info']/*[local-name()='lang']")
          if langs:
              langs[0].text = 'ru'
          tree.write(str(path), encoding='utf-8', xml_declaration=True, pretty_print=False)
          print('[metadata] updated')
          PY

      - name: Independent V4 Pro benchmark only for a complete book
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f reference-progress.json ]; then
            echo '[postflight] no complete-book progress report; benchmark deferred'
            exit 0
          fi
          if ! python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reference-progress.json')
          ok = p.exists() and json.loads(p.read_text('utf-8')).get('status') == 'complete'
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo '[postflight] partial/diagnostic run; benchmark deferred'
            exit 0
          fi
          test -n "${OPENROUTER_API_KEY:-}"
          export BOOKAI_REFERENCE_JUDGE_MODEL='deepseek/deepseek-v4-pro-0813'
          export BOOKAI_REASONING='none'
          python scripts/reference_quality_gate_v2.py \
            --candidate Devices_and_Desires_RU_REFERENCE.fb2 \
            --output reference-quality-postflight.json 2>&1 | tee reference-postflight.log

      - name: Upload hybrid diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: azure-opus-hybrid-diagnostics
          path: |
            hybrid-probe.json
            hybrid-routing.json
            hybrid-sample.json
            hybrid-translation.log
            reference-progress.json
            reference-quality-postflight.json
            Devices_and_Desires_RU_REFERENCE.fb2
          if-no-files-found: ignore
          retention-days: 7

      - name: Save resumable book cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-cache-reference-v10
          key: bookai-reference-v10-${{ github.run_id }}

      - name: Save tiny OPUS-MT cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-opus
          key: opus-mt-en-ru-ct2-int8-v1
