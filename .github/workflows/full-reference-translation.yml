name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chapter-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOOKAI_BASE_URL: https://openrouter.ai/api/v1
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1

      # Fresh chapter: do not reuse Chapter Eleven results.
      BOOKAI_CHAPTER_NAME: Chapter Nine
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      # Strict JSON Schema makes larger batches safe and reduces single-stream API overhead.
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '12'
      BOOKAI_GIGACHAT_BATCH_CHARS: '10000'
      BOOKAI_GIGACHAT_SPLIT_DEPTH: '4'
      BOOKAI_GIGACHAT_MAX_TOKENS: '6000'
      BOOKAI_GIGACHAT_RECOVERY_ROUNDS: '2'

      BOOKAI_ANALYZER_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_TRANSLATOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_GATE_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MEMORY_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_EDITOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_HARD_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MAX_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_LLM_GATE: 'false'
      BOOKAI_REASONING: none

      # First pass stays entirely on Lightning. DeepSeek is analysis + targeted recovery/refinement.
      BOOKAI_HYMT_HARD_THRESHOLD: '999'
      BOOKAI_DEEPSEEK_SEGMENT_CAP: '80'
      BOOKAI_RAPID_REFINE_MAX: '35'
      BOOKAI_RAPID_REFINE_WORKERS: '4'
      BOOKAI_RAPID_REFINE_BATCH_CHARS: '7000'
      BOOKAI_HYBRID_BATCH_CHARS: '9000'
      BOOKAI_BULK_PROBE_SEGMENTS: '8'
      BOOKAI_BULK_MAX_ESTIMATE_SECONDS: '3600'
      BOOKAI_RETRY_ATTEMPTS: '2'
      BOOKAI_REQUEST_TIMEOUT: '180'
      BOOKAI_ANALYZER_REQUEST_TIMEOUT: '120'
      BOOKAI_ANALYSIS_CHARS: '50000'
      BOOKAI_STYLE_SAMPLE_CHARS: '12000'
      BOOKAI_CONTEXT_WORKERS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore fresh Chapter Nine v2 cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-cache-chapter-eval-v2-chapter-nine
          key: bookai-ch09-quality-v2-${{ github.run_id }}
          restore-keys: |
            bookai-ch09-quality-v2-

      - name: Install project and run tests
        env:
          BOOKAI_HYMT_HARD_THRESHOLD: '4.8'
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q src scripts/chapter_reference_translation.py scripts/hybrid_reference_translation.py
          pytest -q

      - name: Verify API secrets without exposing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is not configured' >&2; exit 1; }
          test -n "${OPENROUTER_API_KEY:-}" || { echo 'OPENROUTER_API_KEY is not configured' >&2; exit 1; }
          echo '[bookai] chapter=Chapter Nine primary=GigaChat-3-Lightning strict_schema=1 reasoning=DeepSeek-V4.1-Flash pro=disabled'

      - name: Translate Chapter Nine with hardened pipeline
        shell: bash
        run: |
          set -euo pipefail
          test -f Devices_and_Desires.fb2
          timeout --signal=TERM --kill-after=30s 42m \
            python scripts/chapter_reference_translation.py 2>&1 | tee chapter-eval.log

      - name: Upload Chapter Nine evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-nine-quality-v2-evaluation
          path: |
            Devices_and_Desires_RU_CHAPTER_EVAL.fb2
            chapter-eval-source.txt
            chapter-eval-translated.txt
            chapter-eval-translation-map.json
            chapter-eval.json
            chapter-eval-progress.json
            chapter-eval-probe.json
            chapter-eval-routing.json
            chapter-eval.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Chapter Nine v2 resumable cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-cache-chapter-eval-v2-chapter-nine
          key: bookai-ch09-quality-v2-${{ github.run_id }}
