name: production-literary-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: bookai-production-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chapter-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_BASE_URL: https://api.deepseek.com
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_ULTRA_MODEL: GigaChat-3-Ultra
      BOOKAI_GIGACHAT_ULTRA_TIMEOUT: '55'
      BOOKAI_GIGACHAT_ULTRA_MAX_TOKENS: '5000'
      BOOKAI_GIGACHAT_ULTRA_ATTEMPTS: '3'
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '12'
      BOOKAI_GIGACHAT_BATCH_CHARS: '10000'
      BOOKAI_GIGACHAT_SPLIT_DEPTH: '4'
      BOOKAI_GIGACHAT_MAX_TOKENS: '6000'
      BOOKAI_GIGACHAT_RECOVERY_ROUNDS: '1'
      BOOKAI_GIGACHAT_RATE_LIMIT_ATTEMPTS: '7'
      BOOKAI_GIGACHAT_RATE_LIMIT_BACKOFF: '2.0'
      BOOKAI_GIGACHAT_RATE_LIMIT_MAX_SLEEP: '12.0'
      BOOKAI_GIGACHAT_TOKEN_CACHE: /tmp/bookai-gigachat-token.json
      BOOKAI_GIGACHAT_TOKEN_CACHE_TTL: '1440'
      BOOKAI_GIGACHAT_OAUTH_ATTEMPTS: '2'
      BOOKAI_GIGACHAT_OAUTH_FAILURE_BACKOFF: '5'
      BOOKAI_ANALYZER_MODEL: deepseek-flash
      BOOKAI_TRANSLATOR_MODEL: deepseek-flash
      BOOKAI_GATE_MODEL: deepseek-flash
      BOOKAI_MEMORY_MODEL: deepseek-flash
      BOOKAI_EDITOR_MODEL: deepseek-flash
      BOOKAI_HARD_MODEL: deepseek-flash
      BOOKAI_MAX_MODEL: deepseek-flash
      BOOKAI_LLM_GATE: 'false'
      BOOKAI_REASONING: none
      BOOKAI_HYMT_HARD_THRESHOLD: '999'
      BOOKAI_DEEPSEEK_SEGMENT_CAP: '0'
      BOOKAI_DRAFT_RECOVERY_MAX: '0'
      BOOKAI_SECOND_REPAIR_MAX: '0'
      BOOKAI_FRESH_RETRANSLATE_MAX: '0'
      BOOKAI_BOOK_INTELLIGENCE_WAIT: '30'
      BOOKAI_TM_RETRIEVAL_K: '4'
      BOOKAI_HYBRID_BATCH_CHARS: '10000'
      BOOKAI_BULK_PROBE_SEGMENTS: '8'
      BOOKAI_RETRY_ATTEMPTS: '3'
      BOOKAI_REQUEST_TIMEOUT: '45'
      BOOKAI_ANALYZER_REQUEST_TIMEOUT: '60'
      BOOKAI_ANALYSIS_CHARS: '32000'
      BOOKAI_SOURCE_SAMPLE_WINDOWS: '8'
      BOOKAI_CONTEXT_WORKERS: '3'
      BOOKAI_RELIABILITY_WORKERS: '2'
      BOOKAI_V9F_CUE_WORDS: '5'
      BOOKAI_V9_REPAIR_MAX: '42'
      BOOKAI_V9_REPAIR_WORKERS: '3'
      BOOKAI_V9S_VERIFY_BATCH_CHARS: '11500'
      BOOKAI_V9S_TAIL_REPAIR_MAX: '20'
      BOOKAI_V9T_VERIFY_WORKERS: '2'
      BOOKAI_V9T_TAIL_WORKERS: '3'
      BOOKAI_V9X_RETRANSLATE_MAX: '15'
      BOOKAI_V9X_RETRANSLATE_WORKERS: '2'
      BOOKAI_V9Z_NAME_MAX: '36'
      BOOKAI_V9Z_VERIFY_MAX: '24'
      BOOKAI_V9Z_SECOND_REPAIR_MAX: '8'
      BOOKAI_V9AA_NAME_MAX: '64'
      BOOKAI_V9AA_VERIFY_EXTRA: '8'
      BOOKAI_V9AA_VERIFY_BATCH: '10'
      BOOKAI_V9AB_DEEP_REPAIR_MAX: '48'
      BOOKAI_V9AB_GIGA_EXTRA_MAX: '0'
      BOOKAI_V9AB_DEEP_BATCH: '8'
      BOOKAI_V9AB_FINAL_VERIFY_MAX: '48'
      BOOKAI_V9AB_VERIFY_BATCH: '12'
      BOOKAI_V9AD_NAME_MAX: '60'
      BOOKAI_V9AD_NAME_BATCH: '20'
      BOOKAI_V9AF_SANITIZER_MAX: '32'
      BOOKAI_V9AF_SANITIZER_BATCH: '18'
      BOOKAI_V9AG_RETRY_MAX: '16'
      BOOKAI_V8_SHARED_CACHE: '.bookai-cache-production-literary-v1'
      BOOKAI_FULL_CHAPTER_TIMEOUT_SECONDS: '1200'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and run tests
        env:
          BOOKAI_HYMT_HARD_THRESHOLD: '4.8'
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat cryptography
          python -m compileall -q src scripts
          pytest -q
          python - <<'PY'
          from bookai.gigachat_runtime_guard import is_rate_limit_error
          from scripts.production_book_translation import _stratified_source_sample
          from types import SimpleNamespace
          assert is_rate_limit_error(RuntimeError('HTTP 429 Too Many Requests'))
          assert not is_rate_limit_error(RuntimeError('HTTP 400 invalid response_format schema'))
          rows = [SimpleNamespace(text=f'window-{i}-' + ('x' * 900)) for i in range(100)]
          sample = _stratified_source_sample(rows, 8000)
          assert 'window-0-' in sample
          assert any(f'window-{i}-' in sample for i in range(90, 100))
          assert len(sample) <= 8000
          print('[bookai] runtime guard + stratified source sample ok')
          PY
      - name: Verify API configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is not configured' >&2; exit 1; }
          test -n "${DEEPSEEK_API_KEY:-}" || { echo 'DEEPSEEK_API_KEY is not configured for emergency fallbacks' >&2; exit 1; }
          python - <<'PY'
          from bookai.gigachat_ultra_provider import GigaChatUltraProvider
          p = GigaChatUltraProvider(role='preflight')
          assert p.model == 'GigaChat-3-Ultra'
          assert p.max_attempts <= 3
          assert p.timeout_seconds <= 55
          print('[bookai-ultra-preflight] configured_model=', p.model, 'attempts=', p.max_attempts, 'timeout=', p.timeout_seconds)
          print('[bookai-ultra-preflight] live request intentionally skipped; production runtime owns rate-limit retries')
          PY
          echo '[bookai] production_strategy=literary-production-v1 primary=gigachat-lightning specialist=gigachat-3-ultra fallback=deepseek source-only=yes gold-reference=no'
      - name: Decrypt private full-book source
        if: ${{ success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[full-book]') }}
        shell: bash
        run: |
          set -euo pipefail
          url=$(cat .bookai-vault/evil-for-evil/source-url.txt)
          test -n "$url" || { echo 'secure source URL is empty' >&2; exit 1; }
          mkdir -p /tmp/bookai-private-source
          curl --fail --location --retry 3 --retry-delay 2 "$url" -o /tmp/bookai-private-source/source.part00
          test "$(wc -c < /tmp/bookai-private-source/source.part00)" -eq 475922 || { echo 'encrypted source size mismatch' >&2; exit 1; }
          echo '1eec8f86e9a0d8c30c9ed57aecaa6e7ac3f9a9fed5a2a7532c997d4f78f1872  /tmp/bookai-private-source/source.part00' | sha256sum -c -
          python scripts/source_vault.py decrypt-source \
            --parts-dir /tmp/bookai-private-source \
            --output production_source.fb2 \
            --sha256 98eee8037971ad496dd6d4fb362f4021a258acf3f6e57d53328430cc489569bf
          rm -rf /tmp/bookai-private-source
          test -s production_source.fb2
          echo '[bookai-vault] private Evil for Evil source decrypted only inside runner'
      - name: Restore regression gate
        id: benchmark-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .bookai-benchmark-gate.ok
            chapter-v9-one*.txt
            chapter-v9-one*.json
            chapter-v9-two*.txt
            chapter-v9-two*.json
            chapter-v9-three*.txt
            chapter-v9-three*.json
            production-one.log
            production-two.log
            production-three.log
            production-literary-regression.json
          key: bookai-benchmark-${{ hashFiles('.github/workflows/full-reference-translation.yml', 'scripts/production_literary_translation.py', 'scripts/chapter_reference_translation_v9*.py', 'scripts/evaluate_translation_regression.py', 'src/bookai/**/*.py', 'eval/literary_regression_v2.json', 'Devices_and_Desires.fb2') }}
      - name: Translate release sample with stable production strategy
        if: ${{ steps.benchmark-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -f Devices_and_Desires.fb2
          for word in One Two Three; do
            slug=$(printf '%s' "$word" | tr '[:upper:]' '[:lower:]')
            echo "[bookai] ===== START Chapter ${word} ====="
            BOOKAI_CHAPTER_NAME="Chapter ${word}" timeout --signal=TERM --kill-after=30s 15m \
              python scripts/production_literary_translation.py 2>&1 | tee "production-${slug}.log"
            echo "[bookai] ===== DONE Chapter ${word} ====="
          done
      - name: Enforce 150-case source-grounded literary regression
        if: ${{ steps.benchmark-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/evaluate_translation_regression.py \
            --dataset eval/literary_regression_v2.json \
            --output production-literary-regression.json \
            --fail-on-hard \
            --fail-on-objective \
            chapter-v9-*-translation-map.json
          touch .bookai-benchmark-gate.ok
      - name: Save regression gate
        if: ${{ success() && steps.benchmark-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            .bookai-benchmark-gate.ok
            chapter-v9-one*.txt
            chapter-v9-one*.json
            chapter-v9-two*.txt
            chapter-v9-two*.json
            chapter-v9-three*.txt
            chapter-v9-three*.json
            production-one.log
            production-two.log
            production-three.log
            production-literary-regression.json
          key: bookai-benchmark-${{ hashFiles('.github/workflows/full-reference-translation.yml', 'scripts/production_literary_translation.py', 'scripts/chapter_reference_translation_v9*.py', 'scripts/evaluate_translation_regression.py', 'src/bookai/**/*.py', 'eval/literary_regression_v2.json', 'Devices_and_Desires.fb2') }}
      - name: Confirm regression gate
        shell: bash
        run: |
          set -euo pipefail
          test -f .bookai-benchmark-gate.ok || { echo 'regression gate marker missing' >&2; exit 1; }
          test -f production-literary-regression.json || { echo 'regression report missing' >&2; exit 1; }
      - name: Restore reading-build checkpoint
        if: ${{ success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[full-book]') }}
        uses: actions/cache/restore@v4
        with:
          path: |
            .bookai-full-*
            .bookai-cache-production-literary-v1-*
            .bookai-cache-production-chapter-*
          key: bookai-reading-${{ hashFiles('production_source.fb2') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            bookai-reading-${{ hashFiles('production_source.fb2') }}-
      - name: Translate complete reading book after green sample
        if: ${{ success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[full-book]') }}
        shell: bash
        run: |
          set -euo pipefail
          test -f production_source.fb2 || { echo 'production_source.fb2 is missing' >&2; exit 1; }
          echo '[bookai] benchmark gate passed; starting resumable source-isolated reading build'
          timeout --signal=TERM --kill-after=60s 300m \
            python scripts/production_book_full_translation.py 2>&1 | tee production-full-book.log
      - name: Save reading-build checkpoint
        if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[full-book]') }}
        uses: actions/cache/save@v4
        with:
          path: |
            .bookai-full-*
            .bookai-cache-production-literary-v1-*
            .bookai-cache-production-chapter-*
          key: bookai-reading-${{ hashFiles('production_source.fb2') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Validate complete reading build
        if: ${{ success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[full-book]') }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('production-full-book.json').read_text('utf-8'))
          if not report.get('reading_build_complete'):
              raise SystemExit('full reading build is incomplete')
          output = Path(report['output'])
          if not output.exists() or output.stat().st_size < 10000:
              raise SystemExit('full book artifact is missing or unexpectedly small')
          if report.get('segments_merged') != report.get('segments_total'):
              raise SystemExit('full book segment invariant failed')
          review = report.get('review_required_chapters') or []
          print('[bookai-full-release] reading_build_complete=true status=', report.get('status'),
                'segments=', report['segments_total'], 'bytes=', output.stat().st_size,
                'review_required_chapters=', len(review),
                'chapters_reused=', report.get('chapters_reused', 0))
          PY
      - name: Seal private reading build
        if: ${{ success() && github.event_name == 'push' && contains(github.event.head_commit.message, '[full-book]') }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/source_vault.py seal-output \
            --source production_translation_ru.fb2 \
            --recipient-public 'f6kw2wphfD+/qoHOxeuwBJYuwrJJvtGUQutWGKvunkA=' \
            --output production_translation_ru.encrypted.json
          test -s production_translation_ru.encrypted.json
          echo '[bookai-vault] Russian reading build sealed for local decryption'
      - name: Remove private plaintext before artifact upload
        if: ${{ always() && github.event_name == 'push' && contains(github.event.head_commit.message, '[full-book]') }}
        shell: bash
        run: |
          rm -f production_source.fb2 production_translation_ru.fb2
          rm -rf .bookai-full-*
      - name: Upload production evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-literary-v1-source-only-evaluation
          path: |
            Devices_and_Desires_RU_*_EVAL_V9.fb2
            production_translation_ru.encrypted.json
            chapter-v9-*.txt
            chapter-v9-*.json
            production-*.json
            production-*.log
          if-no-files-found: ignore
          retention-days: 14
