name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOOKAI_BASE_URL: https://openrouter.ai/api/v1
      BOOKAI_HYMT_REPO: tencent/Hy-MT1.5-1.8B-2bit-GGUF
      BOOKAI_HYMT_BASE_URL: http://127.0.0.1:8080/v1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore resumable book cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-cache-reference-v10
          key: bookai-reference-v10-${{ github.run_id }}
          restore-keys: |
            bookai-reference-v10-

      - name: Restore HY-MT model cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/llama.cpp
          key: hymt15-18b-2bit-gguf-v1

      - name: Install project and run tests
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]'
          python -m compileall -q src scripts/hybrid_reference_translation.py scripts/rapid_reference_translation.py
          pytest -q

      - name: Install llama.cpp runtime
        shell: bash
        run: |
          set -euo pipefail
          curl -LsSf https://llama.app/install.sh | sh
          export PATH="$HOME/.local/bin:$HOME/.llama/bin:$PATH"
          LLAMA_BIN="$(command -v llama || true)"
          if [ -z "$LLAMA_BIN" ]; then
            LLAMA_BIN="$(find "$HOME" -type f -name llama -perm -111 2>/dev/null | head -n 1 || true)"
          fi
          if [ -z "$LLAMA_BIN" ]; then
            echo 'llama.cpp installer did not expose the llama executable' >&2
            exit 1
          fi
          echo "LLAMA_BIN=$LLAMA_BIN" >> "$GITHUB_ENV"
          echo "[hy-mt] llama_bin=$LLAMA_BIN"

      - name: Start local HY-MT 2-bit server
        shell: bash
        run: |
          set -euo pipefail
          echo "[hy-mt] starting ${BOOKAI_HYMT_REPO}"
          nohup "$LLAMA_BIN" serve -hf "$BOOKAI_HYMT_REPO" > hymt-server.log 2>&1 &
          echo $! > hymt-server.pid
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8080/v1/models > hymt-models.json 2>/dev/null; then
              echo '[hy-mt] local server ready'
              cat hymt-models.json
              exit 0
            fi
            if ! kill -0 "$(cat hymt-server.pid)" 2>/dev/null; then
              echo '[hy-mt] server exited during startup' >&2
              tail -n 120 hymt-server.log || true
              exit 1
            fi
            sleep 2
          done
          echo '[hy-mt] server startup timed out' >&2
          tail -n 120 hymt-server.log || true
          exit 1

      - name: Hybrid HY-MT → DeepSeek literary translation
        shell: bash
        env:
          BOOKAI_TRANSLATOR_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_ANALYZER_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_GATE_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_MEMORY_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_EDITOR_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_HARD_MODEL: deepseek/deepseek-v4.1-flash
          BOOKAI_LLM_GATE: 'false'
          BOOKAI_REASONING: none
          BOOKAI_HYMT_WORKERS: '2'
          BOOKAI_HYMT_PROBE_SEGMENTS: '8'
          BOOKAI_HYMT_MAX_ESTIMATE_SECONDS: '1500'
          BOOKAI_HYMT_HARD_THRESHOLD: '4.8'
          BOOKAI_HYBRID_BATCH_CHARS: '16000'
          BOOKAI_RAPID_REFINE_WORKERS: '4'
          BOOKAI_RAPID_REFINE_BATCH_CHARS: '8000'
          BOOKAI_RETRY_ATTEMPTS: '2'
          BOOKAI_REQUEST_TIMEOUT: '180'
          BOOKAI_ANALYZER_REQUEST_TIMEOUT: '90'
        run: |
          set -euo pipefail
          test -n "${OPENROUTER_API_KEY:-}"
          test -f Devices_and_Desires.fb2
          echo '[bookai] mode=hybrid-hymt2bit-deepseek-v1 cost_policy=fail-closed'
          timeout --signal=TERM --kill-after=30s 32m \
            python scripts/hybrid_reference_translation.py 2>&1 | tee hybrid-translation.log

      - name: Set Russian FB2 metadata when full artifact exists
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from lxml import etree
          path = Path('Devices_and_Desires_RU_REFERENCE.fb2')
          if not path.exists():
              print('[metadata] no full FB2 produced in this run')
              raise SystemExit(0)
          tree = etree.parse(str(path))
          titles = tree.xpath("//*[local-name()='description']/*[local-name()='title-info']/*[local-name()='book-title']")
          if titles:
              titles[0].text = 'Замыслы и желания'
          langs = tree.xpath("//*[local-name()='description']/*[local-name()='title-info']/*[local-name()='lang']")
          if langs:
              langs[0].text = 'ru'
          tree.write(str(path), encoding='utf-8', xml_declaration=True, pretty_print=False)
          PY

      - name: Independent V4 Pro benchmark only for a complete book
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ ! -f reference-progress.json ]; then
            echo '[postflight] no complete-book progress report; benchmark deferred'
            exit 0
          fi
          if ! python - <<'PY'
          import json
          from pathlib import Path
          p = Path('reference-progress.json')
          ok = p.exists() and json.loads(p.read_text('utf-8')).get('status') == 'complete'
          raise SystemExit(0 if ok else 1)
          PY
          then
            echo '[postflight] partial/sample run; benchmark deferred'
            exit 0
          fi
          export BOOKAI_REFERENCE_JUDGE_MODEL='deepseek/deepseek-v4-pro-0813'
          export BOOKAI_REASONING='none'
          python scripts/reference_quality_gate_v2.py \
            --candidate Devices_and_Desires_RU_REFERENCE.fb2 \
            --output reference-quality-postflight.json 2>&1 | tee reference-postflight.log

      - name: Upload hybrid diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-translation-diagnostics
          path: |
            hybrid-probe.json
            hybrid-routing.json
            hybrid-sample.json
            hybrid-translation.log
            hymt-server.log
            hymt-models.json
            reference-progress.json
            reference-quality-postflight.json
            Devices_and_Desires_RU_REFERENCE.fb2
          if-no-files-found: ignore
          retention-days: 7

      - name: Save resumable book cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-cache-reference-v10
          key: bookai-reference-v10-${{ github.run_id }}

      - name: Save HY-MT model cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/llama.cpp
          key: hymt15-18b-2bit-gguf-v1
