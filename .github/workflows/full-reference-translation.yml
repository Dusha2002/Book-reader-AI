name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chapter-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOOKAI_BASE_URL: https://openrouter.ai/api/v1
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1

      # v5 deliberately tests the largest chapter rather than tuning on Chapter Twelve.
      BOOKAI_CHAPTER_NAME: '__largest__'
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '12'
      BOOKAI_GIGACHAT_BATCH_CHARS: '10000'
      BOOKAI_GIGACHAT_SPLIT_DEPTH: '4'
      BOOKAI_GIGACHAT_MAX_TOKENS: '6000'
      BOOKAI_GIGACHAT_RECOVERY_ROUNDS: '2'

      BOOKAI_ANALYZER_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_TRANSLATOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_GATE_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MEMORY_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_EDITOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_HARD_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MAX_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_LLM_GATE: 'false'
      BOOKAI_REASONING: none

      # v5: free/cheap bulk hot path, then one QE pass and bounded targeted correction.
      BOOKAI_HYMT_HARD_THRESHOLD: '999'
      BOOKAI_DEEPSEEK_SEGMENT_CAP: '80'
      BOOKAI_DRAFT_RECOVERY_MAX: '6'
      BOOKAI_SEMANTIC_QE_BATCH_CHARS: '11000'
      BOOKAI_SEMANTIC_QE_WORKERS: '5'
      BOOKAI_TARGETED_EDIT_WORKERS: '4'
      BOOKAI_SEMANTIC_REPAIR_ROUNDS: '2'
      BOOKAI_FRESH_RETRANSLATE_MAX: '8'
      BOOKAI_RAPID_REFINE_MAX: '16'
      BOOKAI_DIALOGUE_QE_MAX: '20'
      BOOKAI_LITERARY_QE_WORKERS: '4'
      BOOKAI_HYBRID_BATCH_CHARS: '10000'
      BOOKAI_BULK_PROBE_SEGMENTS: '8'
      BOOKAI_RETRY_ATTEMPTS: '2'
      BOOKAI_REQUEST_TIMEOUT: '150'
      BOOKAI_ANALYZER_REQUEST_TIMEOUT: '120'
      BOOKAI_ANALYSIS_CHARS: '45000'
      BOOKAI_CONTEXT_WORKERS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore largest-chapter v5 cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-cache-chapter-eval-v5-largest
          key: bookai-largest-quality-v5-${{ github.run_id }}
          restore-keys: |
            bookai-largest-quality-v5-

      - name: Install project and run tests
        env:
          BOOKAI_HYMT_HARD_THRESHOLD: '4.8'
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q src scripts/chapter_reference_translation_v3.py scripts/chapter_reference_translation_v4.py scripts/chapter_reference_translation_v4b.py scripts/chapter_reference_translation_v5.py scripts/hybrid_reference_translation.py
          pytest -q

      - name: Verify API secrets without exposing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is not configured' >&2; exit 1; }
          test -n "${OPENROUTER_API_KEY:-}" || { echo 'OPENROUTER_API_KEY is not configured' >&2; exit 1; }
          echo '[bookai] chapter=largest architecture=v5 primary=GigaChat-Lightning deepseek_bulk=0 semantic_qe=all-segment targeted_edit=bounded fresh_candidate_max=8 pro=disabled'

      - name: Translate largest chapter with quality-v5 pipeline
        shell: bash
        run: |
          set -euo pipefail
          test -f Devices_and_Desires.fb2
          timeout --signal=TERM --kill-after=30s 34m \
            python scripts/chapter_reference_translation_v5.py 2>&1 | tee chapter-v5.log

      - name: Upload largest-chapter v5 evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: largest-chapter-quality-v5-evaluation
          path: |
            Devices_and_Desires_RU_CHAPTER_EVAL_V5.fb2
            chapter-v5-source.txt
            chapter-v5-translated.txt
            chapter-v5-translation-map.json
            chapter-v5.json
            chapter-v5-progress.json
            chapter-v5-probe.json
            chapter-v5-routing.json
            chapter-v5.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save largest-chapter v5 resumable cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-cache-chapter-eval-v5-largest
          key: bookai-largest-quality-v5-${{ github.run_id }}
