name: full-reference-translation

on:
  push:
    branches: [full-literary-reference-v9]
  workflow_dispatch:

concurrency:
  group: full-reference-translation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  chapter-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      BOOKAI_BASE_URL: https://openrouter.ai/api/v1
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1

      BOOKAI_CHAPTER_NAME: Chapter Twelve
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '12'
      BOOKAI_GIGACHAT_BATCH_CHARS: '10000'
      BOOKAI_GIGACHAT_SPLIT_DEPTH: '4'
      BOOKAI_GIGACHAT_MAX_TOKENS: '6000'
      BOOKAI_GIGACHAT_RECOVERY_ROUNDS: '2'

      BOOKAI_ANALYZER_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_TRANSLATOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_GATE_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MEMORY_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_EDITOR_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_HARD_MODEL: deepseek/deepseek-v4.1-flash
      BOOKAI_MAX_MODEL: deepseek/deepseek-v4.1-flash
      # v4 calls semantic/literary QE explicitly and selectively; the generic
      # harness-wide gate remains off to avoid duplicate judging.
      BOOKAI_LLM_GATE: 'false'
      BOOKAI_REASONING: none

      # GigaChat publishes the fast bulk draft while DeepSeek builds book context.
      # DeepSeek then audits every segment but edits only verified failures.
      BOOKAI_HYMT_HARD_THRESHOLD: '999'
      BOOKAI_DEEPSEEK_SEGMENT_CAP: '80'
      BOOKAI_SEMANTIC_QE_BATCH_CHARS: '9000'
      BOOKAI_SEMANTIC_QE_WORKERS: '4'
      BOOKAI_TARGETED_EDIT_WORKERS: '4'
      BOOKAI_RAPID_REFINE_MAX: '20'
      BOOKAI_LITERARY_QE_WORKERS: '4'
      BOOKAI_HYBRID_BATCH_CHARS: '9000'
      BOOKAI_BULK_PROBE_SEGMENTS: '8'
      BOOKAI_RETRY_ATTEMPTS: '2'
      BOOKAI_REQUEST_TIMEOUT: '150'
      BOOKAI_ANALYZER_REQUEST_TIMEOUT: '120'
      BOOKAI_ANALYSIS_CHARS: '45000'
      BOOKAI_STYLE_SAMPLE_CHARS: '10000'
      BOOKAI_CONTEXT_WORKERS: '4'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Chapter Twelve v4 cache
        uses: actions/cache/restore@v4
        with:
          path: .bookai-cache-chapter-eval-v4-chapter-twelve
          key: bookai-ch12-quality-v4-${{ github.run_id }}
          restore-keys: |
            bookai-ch12-quality-v4-

      - name: Install project and run tests
        env:
          BOOKAI_HYMT_HARD_THRESHOLD: '4.8'
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q src scripts/chapter_reference_translation_v3.py scripts/chapter_reference_translation_v4.py scripts/hybrid_reference_translation.py
          pytest -q

      - name: Verify API secrets without exposing them
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is not configured' >&2; exit 1; }
          test -n "${OPENROUTER_API_KEY:-}" || { echo 'OPENROUTER_API_KEY is not configured' >&2; exit 1; }
          echo '[bookai] chapter=Chapter Twelve architecture=v4 primary=GigaChat-Lightning semantic_qe=DeepSeek-V4.1-Flash targeted_edit=1 literary_qe=bounded pro=disabled'

      - name: Translate Chapter Twelve with quality-v4 pipeline
        shell: bash
        run: |
          set -euo pipefail
          test -f Devices_and_Desires.fb2
          timeout --signal=TERM --kill-after=30s 34m \
            python scripts/chapter_reference_translation_v4.py 2>&1 | tee chapter-v4.log

      - name: Upload Chapter Twelve v4 evaluation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-twelve-quality-v4-evaluation
          path: |
            Devices_and_Desires_RU_CHAPTER_EVAL_V4.fb2
            chapter-v4-source.txt
            chapter-v4-translated.txt
            chapter-v4-translation-map.json
            chapter-v4.json
            chapter-v4-progress.json
            chapter-v4-probe.json
            chapter-v4-routing.json
            chapter-v4.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Save Chapter Twelve v4 resumable cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bookai-cache-chapter-eval-v4-chapter-twelve
          key: bookai-ch12-quality-v4-${{ github.run_id }}
