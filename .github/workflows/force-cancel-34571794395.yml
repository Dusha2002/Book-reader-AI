name: force-cancel-34571794395

on:
  push:
    branches: [ops-force-cancel-34571794395]

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel stale workflow run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '34571794395'
        run: |
          set -euo pipefail
          curl --fail-with-body -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/force-cancel"
          echo "force_cancel_requested=true"
