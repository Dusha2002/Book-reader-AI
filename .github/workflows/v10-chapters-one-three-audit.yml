name: v10-chapters-one-three-audit

on:
  push:
    branches: [experiment/v9ah-fast-deepseek]
    paths:
      - .github/workflows/v10-chapters-one-three-audit.yml
      - src/bookai/v10*.py
      - src/bookai/release_final.py
      - src/bookai/semantic_fidelity.py
      - scripts/chapter_translation_v10_release.py
      - scripts/chapter_translation_v10_release9.py
      - scripts/build_crossbook_goodfellow_sample.py
  workflow_dispatch:

# Expensive model-backed translation must never fan out across stale commits.
# Any newer translation audit on this branch cancels the older one.
concurrency:
  group: v10-translation-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_BASE_URL: https://api.deepseek.com
      BOOKAI_GATE_MODEL: deepseek-flash
      BOOKAI_REASONING: none
      BOOKAI_RETRY_ATTEMPTS: '3'
      BOOKAI_REQUEST_TIMEOUT: '60'
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '8'
      BOOKAI_GIGACHAT_BATCH_CHARS: '6500'
      BOOKAI_GIGACHAT_MAX_TOKENS: '6000'
      BOOKAI_GIGACHAT_TIMEOUT: '55'
      BOOKAI_GIGACHAT_RETRIES: '1'
      BOOKAI_V10_NAME_MAX: '64'
      BOOKAI_V10_NAME_BATCH: '20'
      BOOKAI_V10_TERM_BATCH: '16'
      BOOKAI_V10_DEEP_MAX: '8'
      BOOKAI_V10_RELEASE_DEEP_MAX: '16'
      BOOKAI_V10_RESIDUAL_DEEP_MAX: '12'
      BOOKAI_V10_RECOVERY_BATCH: '4'
      BOOKAI_V10_JSON_RECOVERY_BATCH: '3'
      BOOKAI_V10_BIBLE_CACHE: .bookai-cache-v10/book-bible.json

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install and validate general v10 release
        id: validate
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q src/bookai/v10*.py src/bookai/release_final.py scripts/chapter_translation_v10.py scripts/chapter_translation_v10_release.py scripts/chapter_translation_v10_release9.py scripts/build_crossbook_goodfellow_sample.py
          pytest -q \
            tests/test_v10_architecture.py \
            tests/test_v10_source_only.py \
            tests/test_v10_discourse_quality.py \
            tests/test_v10_integrity_quantity.py \
            tests/test_v10_clause_fidelity.py \
            tests/test_v10_deepseek_routing.py \
            tests/test_v10_release_hardening.py \
            tests/test_release_final.py \
            tests/test_general_release_architecture.py

      - name: Translate Chapters One to Three
        run: |
          set -uo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}"
          test -n "${DEEPSEEK_API_KEY:-}"
          rm -rf .bookai-cache-v10 audit-three
          mkdir -p audit-three
          overall=0
          for chapter in "Chapter One" "Chapter Two" "Chapter Three"; do
            slug=$(echo "$chapter" | tr '[:upper:]' '[:lower:]' | tr ' ' '-')
            mkdir -p "audit-three/$slug"
            echo "=== $chapter ==="
            set +e
            BOOKAI_CHAPTER_NAME="$chapter" \
              /usr/bin/time -f '%e' -o "audit-three/$slug/wall_seconds.txt" \
              timeout --signal=TERM --kill-after=30s 20m \
              python scripts/chapter_translation_v10_release9.py 2>&1 | tee "audit-three/$slug/run.log"
            status=${PIPESTATUS[0]}
            set -e
            echo "$status" > "audit-three/$slug/translation_exit_status.txt"
            cp -f "v10-$slug-report.json" "audit-three/$slug/" 2>/dev/null || true
            cp -f "v10-$slug-map.json" "audit-three/$slug/" 2>/dev/null || true
            cp -f "v10-$slug-source.txt" "audit-three/$slug/" 2>/dev/null || true
            cp -f "v10-$slug-translated.txt" "audit-three/$slug/" 2>/dev/null || true
            cp -f "Devices_and_Desires_RU_V10_$slug.fb2" "audit-three/$slug/" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then overall=1; fi
          done
          cp -f .bookai-cache-v10/book-bible.json audit-three/book-bible.json 2>/dev/null || true
          exit "$overall"

      - name: Build three-chapter aggregate summary
        if: always()
        run: |
          mkdir -p audit-three
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('audit-three')
          rows = []
          totals = {
              'segments': 0,
              'source_chars': 0,
              'chapter_seconds': 0.0,
              'giga_primary_calls': 0,
              'giga_total_calls': 0,
              'deepseek_requests': 0,
              'deepseek_tokens': 0,
              'final_hard': 0,
              'final_integrity': 0,
              'first_pass_missing': 0,
          }
          for slug in ('chapter-one','chapter-two','chapter-three'):
              p = root / slug / f'v10-{slug}-report.json'
              if not p.exists():
                  rows.append({'chapter': slug, 'missing_report': True})
                  continue
              r = json.loads(p.read_text('utf-8'))
              row = {
                  'chapter': r.get('chapter'),
                  'version': r.get('version'),
                  'chapter_selection': r.get('chapter_selection'),
                  'segments': r.get('segments'),
                  'source_chars': r.get('source_chars'),
                  'timing': r.get('timing'),
                  'book_bible': r.get('book_bible'),
                  'primary_transport': r.get('primary_transport'),
                  'usage': r.get('usage'),
                  'qa_initial': r.get('qa_initial'),
                  'qa_after_local': r.get('qa_after_local'),
                  'deepseek_specialist': r.get('deepseek_specialist'),
                  'qa_release_pre': r.get('qa_release_pre'),
                  'release_local_rewriter': r.get('release_local_rewriter'),
                  'qa_release_mid': r.get('qa_release_mid'),
                  'release_deepseek_specialist': r.get('release_deepseek_specialist'),
                  'qa_final': r.get('qa_final'),
                  'final_hard': r.get('final_hard'),
                  'final_integrity': r.get('final_integrity'),
                  'segment_integrity': r.get('segment_integrity'),
              }
              rows.append(row)
              totals['segments'] += int(r.get('segments') or 0)
              totals['source_chars'] += int(r.get('source_chars') or 0)
              totals['chapter_seconds'] += float((r.get('timing') or {}).get('chapter_seconds') or 0)
              totals['giga_primary_calls'] += int(((r.get('usage') or {}).get('gigachat_primary') or {}).get('api_calls') or 0)
              totals['giga_total_calls'] += int(((r.get('usage') or {}).get('gigachat_total') or {}).get('api_calls') or 0)
              totals['deepseek_requests'] += int(((r.get('usage') or {}).get('deepseek') or {}).get('requests') or 0)
              totals['deepseek_tokens'] += int(((r.get('usage') or {}).get('deepseek') or {}).get('total_tokens') or 0)
              totals['final_hard'] += int((r.get('qa_final') or {}).get('hard') or 0)
              totals['final_integrity'] += int((r.get('final_integrity') or {}).get('count') or 0)
              totals['first_pass_missing'] += int((r.get('primary_transport') or {}).get('first_pass_missing') or 0)
          payload = {'chapters': rows, 'totals': totals}
          (root / 'aggregate-summary.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), 'utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Cross-book diagnostic on Deep Learning excerpt
        if: ${{ always() && !cancelled() && steps.validate.outcome == 'success' }}
        run: |
          set -uo pipefail
          rm -rf crossbook-goodfellow
          python scripts/build_crossbook_goodfellow_sample.py crossbook-goodfellow
          mkdir -p crossbook-goodfellow/run crossbook-goodfellow/.bookai-cache
          set +e
          (
            cd crossbook-goodfellow/run
            BOOKAI_SOURCE="../sample.fb2" \
            BOOKAI_CHAPTER_NAME="Chapter One" \
            BOOKAI_V10_BIBLE_CACHE="../.bookai-cache/book-bible.json" \
              /usr/bin/time -f '%e' -o wall_seconds.txt \
              timeout --signal=TERM --kill-after=30s 12m \
              python ../../scripts/chapter_translation_v10_release9.py 2>&1 | tee run.log
            exit ${PIPESTATUS[0]}
          )
          status=$?
          set -e
          echo "$status" > crossbook-goodfellow/translation_exit_status.txt
          cp -f crossbook-goodfellow/run/v10-chapter-one-report.json crossbook-goodfellow/report.json 2>/dev/null || true
          cp -f crossbook-goodfellow/run/v10-chapter-one-map.json crossbook-goodfellow/map.json 2>/dev/null || true
          cp -f crossbook-goodfellow/run/v10-chapter-one-source.txt crossbook-goodfellow/pipeline-source.txt 2>/dev/null || true
          cp -f crossbook-goodfellow/run/v10-chapter-one-translated.txt crossbook-goodfellow/pipeline-translated.txt 2>/dev/null || true
          echo "cross-book diagnostic exit status=$status"
          # Diagnostic only: retain output even when the publication gate finds transferable defects.
          exit 0

      - name: Upload translation audit and cross-book diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-general-release-audit
          path: |
            audit-three
            crossbook-goodfellow
          if-no-files-found: warn
          retention-days: 7
