name: v10-short-three-book-audit

on:
  push:
    branches: [experiment/v9ah-fast-deepseek]
    paths:
      - .github/workflows/v10-chapters-one-three-audit.yml
      - src/bookai/v10*.py
      - src/bookai/release_final.py
      - src/bookai/semantic_fidelity.py
      - scripts/chapter_translation_v10_release.py
      - scripts/chapter_translation_v10_release9.py
      - scripts/build_crossbook_goodfellow_sample.py
      - scripts/build_short_parker_sample.py
      - scripts/build_short_franklin_sample.py
      - tests/test_general_release_architecture.py
      - tests/test_v10_clause_fidelity.py
      - tests/test_v10_entity_graph.py
      - tests/test_v10_semantic_profile.py
  workflow_dispatch:

concurrency:
  group: v10-translation-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_BASE_URL: https://api.deepseek.com
      BOOKAI_GATE_MODEL: deepseek-flash
      BOOKAI_REASONING: none
      BOOKAI_RETRY_ATTEMPTS: '3'
      BOOKAI_REQUEST_TIMEOUT: '60'
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '4'
      BOOKAI_GIGACHAT_BATCH_CHARS: '4800'
      BOOKAI_GIGACHAT_MAX_TOKENS: '6000'
      BOOKAI_GIGACHAT_TIMEOUT: '55'
      BOOKAI_GIGACHAT_RETRIES: '1'
      BOOKAI_GIGACHAT_TERM_TIMEOUT: '12'
      BOOKAI_V10_NAME_MAX: '48'
      BOOKAI_V10_NAME_BATCH: '20'
      BOOKAI_V10_TERM_BATCH: '24'
      BOOKAI_V10_DEEP_MAX: '4'
      BOOKAI_V10_RELEASE_DEEP_MAX: '4'
      BOOKAI_V10_RESIDUAL_DEEP_MAX: '4'
      BOOKAI_V10_EDITORIAL_MAX: '6'
      BOOKAI_V10_RECOVERY_BATCH: '4'
      BOOKAI_V10_JSON_RECOVERY_BATCH: '3'
      BOOKAI_SHORT_VARIANT: 'c'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate code and build short samples
        id: validate
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q \
            src/bookai/v10*.py src/bookai/release_final.py \
            scripts/chapter_translation_v10_release9.py \
            scripts/build_crossbook_goodfellow_sample.py \
            scripts/build_short_parker_sample.py \
            scripts/build_short_franklin_sample.py
          pytest -q \
            tests/test_v10_architecture.py \
            tests/test_v10_source_only.py \
            tests/test_v10_discourse_quality.py \
            tests/test_v10_integrity_quantity.py \
            tests/test_v10_clause_fidelity.py \
            tests/test_v10_deepseek_routing.py \
            tests/test_v10_release_hardening.py \
            tests/test_release_final.py \
            tests/test_general_release_architecture.py \
            tests/test_v10_entity_graph.py \
            tests/test_v10_semantic_profile.py
          rm -rf short-parker short-goodfellow short-franklin
          python scripts/build_short_parker_sample.py Devices_and_Desires.fb2 short-parker
          python scripts/build_crossbook_goodfellow_sample.py short-goodfellow
          python scripts/build_short_franklin_sample.py short-franklin
          for sample in short-parker short-goodfellow short-franklin; do
            test -s "$sample/sample.fb2"
            test -s "$sample/memory-source.fb2"
          done

      - name: Restore stable whole-book BookMemory cache
        uses: actions/cache@v4
        with:
          path: .v10-book-memory-cache
          key: v10-clean10-stable-memory-v1-${{ runner.os }}

      - name: Translate short Parker, Goodfellow and Franklin samples
        run: |
          set -uo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}"
          test -n "${DEEPSEEK_API_KEY:-}"
          for sample in short-parker short-goodfellow short-franklin; do
            echo "=== cold/window run: $sample ==="
            mkdir -p "$sample/run" ".v10-book-memory-cache/$sample"
            set +e
            (
              cd "$sample/run"
              BOOKAI_SOURCE="../sample.fb2" \
              BOOKAI_MEMORY_SOURCE="../memory-source.fb2" \
              BOOKAI_CHAPTER_NAME="Chapter One" \
              BOOKAI_V10_BIBLE_CACHE="../../.v10-book-memory-cache/$sample/book-bible.json" \
                /usr/bin/time -f '%e' -o wall_seconds.txt \
                timeout --signal=TERM --kill-after=30s 5m \
                python ../../scripts/chapter_translation_v10_release9.py 2>&1 | tee run.log
              exit ${PIPESTATUS[0]}
            )
            status=$?
            set -e
            echo "$status" > "$sample/translation_exit_status.txt"
            cp -f "$sample/run/v10-chapter-one-report.json" "$sample/report.json" 2>/dev/null || true
            cp -f "$sample/run/v10-chapter-one-map.json" "$sample/map.json" 2>/dev/null || true
            cp -f "$sample/run/v10-chapter-one-source.txt" "$sample/pipeline-source.txt" 2>/dev/null || true
            cp -f "$sample/run/v10-chapter-one-translated.txt" "$sample/pipeline-translated.txt" 2>/dev/null || true
            cp -f ".v10-book-memory-cache/$sample/book-bible.json" "$sample/book-bible.json" 2>/dev/null || true
          done

      - name: Warm replay Goodfellow with identical BookMemory
        if: always()
        run: |
          set -uo pipefail
          sample=short-goodfellow
          mkdir -p "$sample/warm-run" ".v10-book-memory-cache/$sample"
          set +e
          (
            cd "$sample/warm-run"
            BOOKAI_SOURCE="../sample.fb2" \
            BOOKAI_MEMORY_SOURCE="../memory-source.fb2" \
            BOOKAI_CHAPTER_NAME="Chapter One" \
            BOOKAI_V10_BIBLE_CACHE="../../.v10-book-memory-cache/$sample/book-bible.json" \
              /usr/bin/time -f '%e' -o wall_seconds.txt \
              timeout --signal=TERM --kill-after=30s 4m \
              python ../../scripts/chapter_translation_v10_release9.py 2>&1 | tee run.log
            exit ${PIPESTATUS[0]}
          )
          status=$?
          set -e
          echo "$status" > "$sample/warm_translation_exit_status.txt"
          cp -f "$sample/warm-run/v10-chapter-one-report.json" "$sample/warm-report.json" 2>/dev/null || true
          cp -f "$sample/warm-run/v10-chapter-one-map.json" "$sample/warm-map.json" 2>/dev/null || true
          cp -f "$sample/warm-run/v10-chapter-one-translated.txt" "$sample/warm-pipeline-translated.txt" 2>/dev/null || true

      - name: Build short three-book summary
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          rows = []
          for name in ('short-parker', 'short-goodfellow', 'short-franklin'):
              root = Path(name)
              meta = json.loads((root / 'sample-meta.json').read_text('utf-8')) if (root / 'sample-meta.json').exists() else {}
              report = json.loads((root / 'report.json').read_text('utf-8')) if (root / 'report.json').exists() else {}
              status = (root / 'translation_exit_status.txt').read_text('utf-8').strip() if (root / 'translation_exit_status.txt').exists() else 'missing'
              rows.append({
                  'sample': name,
                  'exit_status': status,
                  'sample_meta': meta,
                  'segments': report.get('segments'),
                  'source_chars': report.get('source_chars'),
                  'memory_source': report.get('memory_source'),
                  'whole_book_memory_segments': report.get('whole_book_memory_segments'),
                  'timing': report.get('timing'),
                  'book_bible': report.get('book_bible'),
                  'terminology_verifier': report.get('terminology_verifier'),
                  'semantic_editorial_review': report.get('semantic_editorial_review'),
                  'primary_transport': report.get('primary_transport'),
                  'usage': report.get('usage'),
                  'qa_initial': report.get('qa_initial'),
                  'qa_final': report.get('qa_final'),
                  'final_hard': report.get('final_hard'),
                  'final_integrity': report.get('final_integrity'),
              })

          warm_root = Path('short-goodfellow')
          warm_report = json.loads((warm_root / 'warm-report.json').read_text('utf-8')) if (warm_root / 'warm-report.json').exists() else {}
          warm_status = (warm_root / 'warm_translation_exit_status.txt').read_text('utf-8').strip() if (warm_root / 'warm_translation_exit_status.txt').exists() else 'missing'
          warm = {
              'exit_status': warm_status,
              'timing': warm_report.get('timing'),
              'book_bible': warm_report.get('book_bible'),
              'terminology_verifier': warm_report.get('terminology_verifier'),
              'semantic_editorial_review': warm_report.get('semantic_editorial_review'),
              'qa_final': warm_report.get('qa_final'),
              'final_hard': warm_report.get('final_hard'),
              'final_integrity': warm_report.get('final_integrity'),
          }
          payload = {
              'mode': 'short-three-book-smoke-unseen-c-stable-whole-book-memory',
              'samples': rows,
              'goodfellow_warm_replay': warm,
          }
          Path('short-three-book-summary.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2), 'utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Evaluate short audit gate
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          def status(path):
              p = Path(path)
              return p.read_text('utf-8').strip() if p.exists() else 'missing'

          parker = status('short-parker/translation_exit_status.txt')
          franklin = status('short-franklin/translation_exit_status.txt')
          goodfellow_cold = status('short-goodfellow/translation_exit_status.txt')
          goodfellow_warm = status('short-goodfellow/warm_translation_exit_status.txt')
          print({
              'parker': parker,
              'franklin': franklin,
              'goodfellow_cold': goodfellow_cold,
              'goodfellow_warm': goodfellow_warm,
          })
          if parker != '0' or franklin != '0' or goodfellow_warm != '0':
              raise SystemExit(1)
          PY

      - name: Upload short three-book audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v10-short-three-book-smoke
          path: |
            short-parker
            short-goodfellow
            short-franklin
            short-three-book-summary.json
          if-no-files-found: warn
          retention-days: 7
