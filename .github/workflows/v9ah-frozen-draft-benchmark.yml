name: v9ah-frozen-draft-benchmark

on:
  push:
    branches: [experiment/v9ah-fast-deepseek]
  workflow_dispatch:

concurrency:
  group: v9ah-frozen-draft-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      BOOKAI_BASE_URL: https://api.deepseek.com
      GIGACHAT_AUTH_KEY: ${{ secrets.GIGACHAT_AUTH_KEY }}
      GIGACHAT_SCOPE: GIGACHAT_API_PERS
      GIGACHAT_BASE_URL: https://api.giga.chat/v1
      BOOKAI_GIGACHAT_MODEL: GigaChat-3-Lightning
      BOOKAI_GIGACHAT_BATCH_SEGMENTS: '12'
      BOOKAI_GIGACHAT_BATCH_CHARS: '10000'
      BOOKAI_GIGACHAT_SPLIT_DEPTH: '4'
      BOOKAI_GIGACHAT_MAX_TOKENS: '6000'
      BOOKAI_GIGACHAT_RECOVERY_ROUNDS: '1'
      BOOKAI_GIGACHAT_RATE_LIMIT_ATTEMPTS: '7'
      BOOKAI_GIGACHAT_RATE_LIMIT_BACKOFF: '2.0'
      BOOKAI_GIGACHAT_RATE_LIMIT_MAX_SLEEP: '15.0'
      BOOKAI_GIGACHAT_TOKEN_CACHE: /tmp/bookai-gigachat-token.json
      BOOKAI_GIGACHAT_TOKEN_CACHE_TTL: '1440'
      BOOKAI_GIGACHAT_OAUTH_ATTEMPTS: '2'
      BOOKAI_GIGACHAT_OAUTH_FAILURE_BACKOFF: '5'
      BOOKAI_ANALYZER_MODEL: deepseek-flash
      BOOKAI_TRANSLATOR_MODEL: deepseek-flash
      BOOKAI_GATE_MODEL: deepseek-flash
      BOOKAI_MEMORY_MODEL: deepseek-flash
      BOOKAI_EDITOR_MODEL: deepseek-flash
      BOOKAI_HARD_MODEL: deepseek-flash
      BOOKAI_MAX_MODEL: deepseek-flash
      BOOKAI_LLM_GATE: 'false'
      BOOKAI_REASONING: none
      BOOKAI_HYMT_HARD_THRESHOLD: '999'
      BOOKAI_DEEPSEEK_SEGMENT_CAP: '0'
      BOOKAI_DRAFT_RECOVERY_MAX: '0'
      BOOKAI_SECOND_REPAIR_MAX: '0'
      BOOKAI_FRESH_RETRANSLATE_MAX: '0'
      BOOKAI_BOOK_INTELLIGENCE_WAIT: '30'
      BOOKAI_TM_RETRIEVAL_K: '4'
      BOOKAI_HYBRID_BATCH_CHARS: '10000'
      BOOKAI_BULK_PROBE_SEGMENTS: '8'
      BOOKAI_RETRY_ATTEMPTS: '3'
      BOOKAI_REQUEST_TIMEOUT: '45'
      BOOKAI_ANALYZER_REQUEST_TIMEOUT: '60'
      BOOKAI_ANALYSIS_CHARS: '32000'
      BOOKAI_CONTEXT_WORKERS: '3'
      BOOKAI_RELIABILITY_WORKERS: '2'
      BOOKAI_V9F_CUE_WORDS: '5'
      BOOKAI_V9_REPAIR_MAX: '42'
      BOOKAI_V9_REPAIR_WORKERS: '3'
      BOOKAI_V9S_VERIFY_BATCH_CHARS: '11500'
      BOOKAI_V9S_TAIL_REPAIR_MAX: '20'
      BOOKAI_V9T_VERIFY_WORKERS: '2'
      BOOKAI_V9T_TAIL_WORKERS: '3'
      BOOKAI_V9X_RETRANSLATE_MAX: '15'
      BOOKAI_V9X_RETRANSLATE_WORKERS: '2'
      BOOKAI_V9Z_NAME_MAX: '36'
      BOOKAI_V9Z_VERIFY_MAX: '24'
      BOOKAI_V9Z_SECOND_REPAIR_MAX: '8'
      BOOKAI_V9AA_NAME_MAX: '64'
      BOOKAI_V9AA_VERIFY_EXTRA: '8'
      BOOKAI_V9AA_VERIFY_BATCH: '10'
      BOOKAI_V9AB_DEEP_REPAIR_MAX: '48'
      BOOKAI_V9AB_GIGA_EXTRA_MAX: '0'
      BOOKAI_V9AB_DEEP_BATCH: '8'
      BOOKAI_V9AB_FINAL_VERIFY_MAX: '48'
      BOOKAI_V9AB_VERIFY_BATCH: '12'
      BOOKAI_V9AD_NAME_MAX: '60'
      BOOKAI_V9AD_NAME_BATCH: '20'
      BOOKAI_V9AF_SANITIZER_MAX: '32'
      BOOKAI_V9AF_SANITIZER_BATCH: '18'
      BOOKAI_V9AG_RETRY_MAX: '16'
      BOOKAI_FAST_EVIDENCE_MAX: '16'
      BOOKAI_CHAPTER_NAME: Chapter Twelve
      BOOKAI_FROZEN_DRAFT_PATH: benchmark/frozen-primary-draft.json

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install, compile and test
        env:
          BOOKAI_HYMT_HARD_THRESHOLD: '4.8'
        shell: bash
        run: |
          set -euo pipefail
          pip install -e '.[dev]' gigachat
          python -m compileall -q \
            src \
            scripts/chapter_reference_translation_v9ah.py \
            scripts/chapter_reference_translation_v9ah_frozen.py \
            scripts/chapter_reference_translation_v9al_fast_deepseek.py \
            scripts/chapter_reference_translation_v9am_numeric_fast.py \
            scripts/chapter_reference_translation_v9am_frozen.py
          pytest -q

      - name: Verify API credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GIGACHAT_AUTH_KEY:-}" || { echo 'GIGACHAT_AUTH_KEY is not configured' >&2; exit 1; }
          test -n "${DEEPSEEK_API_KEY:-}" || { echo 'DEEPSEEK_API_KEY is not configured' >&2; exit 1; }
          echo '[bookai] frozen A/B: Lightning draft recorded once; baseline and fast replay the same segment translations'

      - name: Seed one frozen Lightning draft
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bookai-cache-chapter-eval-v3-* .bookai-cache-v9ah-seed
          rm -f chapter-v3-* chapter-v9-* Devices_and_Desires_RU_*_EVAL_V9.fb2
          mkdir -p benchmark/seed
          export BOOKAI_V8_SHARED_CACHE='.bookai-cache-v9ah-seed'
          export BOOKAI_FROZEN_DRAFT_MODE='record'
          timeout --signal=TERM --kill-after=30s 15m \
            python scripts/chapter_reference_translation_v9ah_frozen.py \
            2>&1 | tee benchmark/seed/run.log
          test -s benchmark/frozen-primary-draft.json
          cp -f chapter-v9-* benchmark/seed/ 2>/dev/null || true
          cp -f Devices_and_Desires_RU_*_EVAL_V9.fb2 benchmark/seed/ 2>/dev/null || true

      - name: Replay frozen draft through clean v9ah baseline
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bookai-cache-chapter-eval-v3-* .bookai-cache-v9ah-frozen-baseline
          rm -f chapter-v3-* chapter-v9-* Devices_and_Desires_RU_*_EVAL_V9.fb2
          mkdir -p benchmark/baseline
          export BOOKAI_V8_SHARED_CACHE='.bookai-cache-v9ah-frozen-baseline'
          export BOOKAI_FROZEN_DRAFT_MODE='replay'
          /usr/bin/time -f '%e' -o benchmark/baseline/elapsed_seconds.txt \
            timeout --signal=TERM --kill-after=30s 15m \
            python scripts/chapter_reference_translation_v9ah_frozen.py \
            2>&1 | tee benchmark/baseline/run.log
          cp -f chapter-v9-* benchmark/baseline/ 2>/dev/null || true
          cp -f Devices_and_Desires_RU_*_EVAL_V9.fb2 benchmark/baseline/ 2>/dev/null || true

      - name: Replay identical draft through numeric fast path
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bookai-cache-chapter-eval-v3-* .bookai-cache-v9am-frozen-fast
          rm -f chapter-v3-* chapter-v9-* Devices_and_Desires_RU_*_EVAL_V9.fb2
          mkdir -p benchmark/fast
          export BOOKAI_V8_SHARED_CACHE='.bookai-cache-v9am-frozen-fast'
          /usr/bin/time -f '%e' -o benchmark/fast/elapsed_seconds.txt \
            timeout --signal=TERM --kill-after=30s 15m \
            python scripts/chapter_reference_translation_v9am_frozen.py \
            2>&1 | tee benchmark/fast/run.log
          cp -f chapter-v9-* benchmark/fast/ 2>/dev/null || true
          cp -f Devices_and_Desires_RU_*_EVAL_V9.fb2 benchmark/fast/ 2>/dev/null || true

      - name: Evaluate frozen outputs
        if: always()
        shell: bash
        run: |
          set -u
          for side in baseline fast; do
            map="benchmark/${side}/chapter-v9-chapter-twelve-translation-map.json"
            if test -f "$map"; then
              python scripts/evaluate_translation_regression.py \
                --dataset eval/literary_regression_v1.json \
                --output "benchmark/${side}/regression.json" \
                "$map" || true
            fi
          done

      - name: Build deterministic A/B summary
        if: always()
        shell: bash
        run: |
          mkdir -p benchmark
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from bookai.numeric_fidelity import compare_numeric_fidelity

          root = Path('benchmark')

          def read_json(path):
              try:
                  return json.loads(Path(path).read_text('utf-8'))
              except Exception:
                  return {}

          def elapsed(folder):
              try:
                  return float((folder / 'elapsed_seconds.txt').read_text('utf-8').strip())
              except Exception:
                  return None

          def numeric_failures(mapping):
              rows = []
              for row in mapping if isinstance(mapping, list) else []:
                  source = str(row.get('source') or '')
                  translation = str(row.get('translation') or '')
                  check = compare_numeric_fidelity(source, translation)
                  if not check.get('ok', True):
                      rows.append({
                          'id': row.get('id'),
                          'source_values': check.get('source_values'),
                          'target_values': check.get('target_values'),
                          'missing': check.get('missing'),
                      })
              return rows

          def collect(name):
              folder = root / name
              report = read_json(folder / 'chapter-v9-chapter-twelve.json')
              mapping = read_json(folder / 'chapter-v9-chapter-twelve-translation-map.json')
              return {
                  'elapsed_seconds': elapsed(folder),
                  'completion_percent': report.get('completion_percent'),
                  'segments': report.get('segments'),
                  'source_chars': report.get('source_chars'),
                  'gigachat_usage': report.get('gigachat_usage'),
                  'final_quality': report.get('final_quality'),
                  'post_export_issue_counts': report.get('post_export_issue_counts'),
                  'deepseek_usage': (report.get('extra') or {}).get('deepseek_usage'),
                  'architecture': report.get('architecture'),
                  'fast_path': report.get('v9al_fast_path'),
                  'numeric_contract': report.get('v9am_numeric_fidelity'),
                  'regression': read_json(folder / 'regression.json'),
                  'numeric_failures': numeric_failures(mapping),
                  '_mapping': mapping,
              }

          frozen_raw = (root / 'frozen-primary-draft.json').read_bytes() if (root / 'frozen-primary-draft.json').exists() else b''
          frozen = read_json(root / 'frozen-primary-draft.json')
          baseline = collect('baseline')
          fast = collect('fast')

          baseline_map = {str(x.get('id')): str(x.get('translation') or '') for x in baseline.pop('_mapping', []) if isinstance(x, dict)}
          fast_map = {str(x.get('id')): str(x.get('translation') or '') for x in fast.pop('_mapping', []) if isinstance(x, dict)}
          changed_ids = sorted(sid for sid in set(baseline_map) | set(fast_map) if baseline_map.get(sid) != fast_map.get(sid))

          b = baseline.get('elapsed_seconds')
          f = fast.get('elapsed_seconds')
          summary = {
              'chapter': 'Chapter Twelve',
              'comparison': 'same frozen Lightning primary draft: v9ah baseline vs v9am numeric evidence fast path',
              'gigachat_ultra_used': False,
              'frozen_draft': {
                  'sha256': hashlib.sha256(frozen_raw).hexdigest() if frozen_raw else None,
                  'entries': len((frozen or {}).get('entries') or {}),
                  'base_backend': (frozen or {}).get('base_backend'),
              },
              'baseline': baseline,
              'fast': fast,
              'postprocess_speedup_x': round(b / f, 3) if b and f else None,
              'final_translation_diff_count': len(changed_ids),
              'final_translation_diff_ids': changed_ids,
              'acceptance_rule': (
                  'Promote only if fast has zero numeric-contract failures, no material regression increase, '
                  'and fewer/equal objective hard defects while reducing DeepSeek work or postprocess latency.'
              ),
          }
          (root / 'summary.json').write_text(json.dumps(summary, ensure_ascii=False, indent=2), 'utf-8')
          print('[frozen-draft-summary] ' + json.dumps({
              'draft_entries': summary['frozen_draft']['entries'],
              'baseline_seconds': b,
              'fast_seconds': f,
              'postprocess_speedup_x': summary['postprocess_speedup_x'],
              'baseline_numeric_failures': len(baseline.get('numeric_failures') or []),
              'fast_numeric_failures': len(fast.get('numeric_failures') or []),
              'diff_count': len(changed_ids),
          }, ensure_ascii=False))
          PY

      - name: Upload frozen benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v9ah-v9am-frozen-draft-chapter-twelve
          path: benchmark/
          if-no-files-found: warn
          retention-days: 7
