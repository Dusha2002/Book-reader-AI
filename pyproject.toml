[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-reader-ai"
version = "0.3.0"
description = "Selective multi-model literary translation harness for FB2, EPUB, DOCX and TXT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "lxml>=5.3,<7",
  "python-docx>=1.1,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.20,<1",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.24,<2"]
local = ["transformers>=4.50,<6", "torch>=2.5,<3", "sentencepiece>=0.2,<1", "accelerate>=1,<2"]
mt = ["ctranslate2>=4.6,<5", "sentencepiece>=0.2,<1"]

[project.scripts]
bookai = "bookai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bookai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
