[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "book-reader-ai"
version = "0.1.0"
description = "Context-aware literary book translation pipeline for FB2 and EPUB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.116,<1",
  "httpx>=0.27,<1",
  "lxml>=5.3,<7",
  "python-multipart>=0.0.20,<1",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[project.scripts]
bookai = "bookai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bookai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
